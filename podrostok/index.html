<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Голосование · Подростковый возраст</title>
<style>
  /* Тема берётся из настроек телефона: у зала разные устройства, и страница
     не должна слепить белым в тёмной аудитории. Цвета — только отсюда. */
  :root{
    --bg:#fbfbfd; --text:#1d1d1f; --text-2:#6e6e73; --hair:rgba(0,0,0,.12);
    --card:#fff; --on-bg:#1d1d1f; --on-text:#fff;
    --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif;
    --textf:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
    --ease:cubic-bezier(.22,.7,.28,1);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --text:#f5f5f7; --text-2:#a1a1a6; --hair:rgba(255,255,255,.16);
           --card:#1c1c1e; --on-bg:#f5f5f7; --on-text:#000; }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:var(--bg); color:var(--text); font-family:var(--textf);
       min-height:100svh; display:flex; flex-direction:column;
       padding:calc(24px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
       -webkit-font-smoothing:antialiased;}

  header{padding-top:8px;}
  .kick{font-weight:600; font-size:14px; color:var(--text-2);}
  h1{font-family:var(--display); font-weight:700; font-size:28px; line-height:1.14;
     letter-spacing:-.03em; margin-top:12px; text-wrap:pretty;}
  .sub{font-size:16px; line-height:1.45; color:var(--text-2); margin-top:12px;}

  .opts{display:flex; flex-direction:column; gap:12px; margin:32px 0 auto;}
  button.opt{display:flex; align-items:center; gap:16px; width:100%; min-height:84px;
    text-align:left; font:inherit; color:var(--text); cursor:pointer;
    background:var(--card); border:1px solid var(--hair); border-radius:20px; padding:18px 20px;
    transition:transform 280ms var(--ease), background-color 320ms var(--ease),
               color 320ms var(--ease), border-color 320ms var(--ease);}
  button.opt:active{transform:scale(.98);}
  button.opt:disabled{cursor:progress;}
  .num{font-family:var(--display); font-weight:700; font-size:34px; line-height:1;
       letter-spacing:-.04em; min-width:26px; color:var(--text-2);
       transition:color 320ms var(--ease);}
  .name{flex:1; font-family:var(--display); font-weight:600; font-size:20px; line-height:1.25;
        letter-spacing:-.012em;}
  /* галочка нарисована рамкой: без шрифтов со значками и без картинок */
  .tick{width:24px; height:24px; border-radius:50%; flex:none; position:relative;
        border:1.5px solid var(--hair); transition:border-color 320ms var(--ease);}
  .tick::after{content:""; position:absolute; left:7px; top:3.5px; width:6px; height:11px;
        border:solid currentColor; border-width:0 2px 2px 0; transform:rotate(45deg) scale(.4);
        opacity:0; transition:opacity 260ms var(--ease), transform 320ms var(--ease);}

  button.opt.on{background:var(--on-bg); color:var(--on-text); border-color:var(--on-bg);}
  button.opt.on .num{color:var(--on-text); opacity:.6;}
  button.opt.on .tick{border-color:currentColor;}
  button.opt.on .tick::after{opacity:1; transform:rotate(45deg) scale(1);}

  footer{margin-top:28px; min-height:50px;}
  #state{font-size:16px; line-height:1.45; opacity:0; transition:opacity 360ms var(--ease);}
  #state.show{opacity:1;}
  #state b{font-weight:600;}
  .hint{font-size:13.5px; color:var(--text-2); margin-top:8px;}

  @media (min-width:620px){
    body{max-width:560px; margin:0 auto; justify-content:center;}
    h1{font-size:38px;}
    .opts{margin:40px 0 0;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:1ms !important;}
  }
</style>
</head>
<body>

<header>
  <div class="kick">Психологические особенности развития личности</div>
  <h1>С какого возраста должна наступать полная ответственность?</h1>
  <div class="sub">Один ответ. Передумать можно — нажмите другой вариант, засчитается последний.</div>
</header>

<div class="opts">
  <button class="opt" id="a" type="button" aria-pressed="false">
    <span class="num">1</span>
    <span class="name">С 18, как в законе</span>
    <span class="tick" aria-hidden="true"></span>
  </button>
  <button class="opt" id="b" type="button" aria-pressed="false">
    <span class="num">2</span>
    <span class="name">С 14–16, на пике поиска впечатлений</span>
    <span class="tick" aria-hidden="true"></span>
  </button>
</div>

<footer>
  <div id="state" role="status" aria-live="polite"></div>
  <div class="hint">Результаты видны на экране в аудитории</div>
</footer>

<script>
(function(){
"use strict";
/* Тема голосования. Та же строка стоит в презентации (VOTE_TOPIC). */
var TOPIC='podrostok-575d6624';
var LABEL={A:'1 — с 18, как в законе', B:'2 — с 14–16, на пике поиска впечатлений'};

/* Постоянный случайный номер голосующего: один человек — один голос,
   переголосование заменяет прежний. Ключи привязаны к теме, чтобы телефон,
   голосовавший на другом докладе, не показал чужой прошлый выбор. */
var ID_KEY='golos-id-'+TOPIC, PICK_KEY='golos-vybor-'+TOPIC, me;
try{
  me=localStorage.getItem(ID_KEY);
  if(!me){ me=Math.random().toString(36).slice(2,10); localStorage.setItem(ID_KEY,me); }
}catch(e){ me=Math.random().toString(36).slice(2,10); }

var st=document.getElementById('state'),
    btn={A:document.getElementById('a'), B:document.getElementById('b')},
    busy=false;

function say(html){ st.className='show'; st.innerHTML=html; }
function mark(v){
  ['A','B'].forEach(function(k){
    btn[k].classList.toggle('on', v===k);
    btn[k].setAttribute('aria-pressed', v===k? 'true' : 'false');
  });
}
function lock(on){ busy=on; btn.A.disabled=btn.B.disabled=on; }

function send(v){
  if(busy) return;
  lock(true);
  say('Отправляю…');
  fetch('https://ntfy.sh/'+TOPIC+'/publish?message='+encodeURIComponent(me+':'+v), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(){
      lock(false); mark(v);
      try{ localStorage.setItem(PICK_KEY, v); }catch(e){}
      say('Голос учтён: <b>'+LABEL[v]+'</b>');
    })
    .catch(function(){
      lock(false);
      say('Не получилось отправить. Проверьте интернет и нажмите ещё раз.');
    });
}

btn.A.onclick=function(){ send('A'); };
btn.B.onclick=function(){ send('B'); };

try{
  var prev=localStorage.getItem(PICK_KEY);
  if(prev==='A' || prev==='B'){ mark(prev); say('Ваш голос: <b>'+LABEL[prev]+'</b>. Можно изменить.'); }
}catch(e){}
})();
</script>
</body>
</html>
