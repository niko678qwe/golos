<head>

<title>Камера жестов</title>
<style>
:root {
  --bg: #0b0b0c;
  --fg: #f3f3f4;
  --mut: rgba(243, 243, 244, .66);
  --dim: rgba(243, 243, 244, .4);
  --glass-hi: rgba(36, 36, 40, .72);
  --line: rgba(255, 255, 255, .13);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
body { overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.ekran { position: fixed; inset: 0; display: none; }
.ekran.on { display: flex; }

/* Пароль — как у пульта. */
#s-parol { align-items: center; justify-content: center; padding: 24px 20px; }
.karta { width: 100%; max-width: 420px; }
.nadzag { margin: 0 0 14px; font-size: 13px; color: var(--dim); line-height: 1.45; }
h2 { margin: 0 0 14px; font-size: 26px; line-height: 1.15; font-weight: 650; }
p { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: var(--mut); }
.melko { font-size: 13px; color: var(--dim); }
#parol { display: block; width: 100%; margin: 18px 0 0; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--glass-hi); color: var(--fg); font: 600 24px/1.2 var(--font); letter-spacing: .35em; text-align: center; outline: none; }
.knopka { display: block; width: 100%; margin: 22px 0 16px; padding: 17px 20px; border: 0; border-radius: 16px;
  background: var(--fg); color: #0b0b0c; font-size: 17px; font-weight: 650; cursor: pointer; }
.knopka:disabled { opacity: .5; }

/* Камера: видео на весь экран, точки рук поверх, сверху — связь и кадр
   презентации, снизу — какой жест держат и полоса удержания. */
#s-kam { flex-direction: column; }
#kam-video, #kam-ruki { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.zerkalo { transform: scaleX(-1); }
.kam-verh, .kam-niz { position: relative; z-index: 2; padding: max(14px, env(safe-area-inset-top)) 16px 14px; background: linear-gradient(rgba(0, 0, 0, .7), rgba(0, 0, 0, 0)); }
.kam-verh { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
#kam-kadr { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kam-svyaz { color: var(--dim); }
#s-kam.da #kam-svyaz { color: var(--fg); }
.kam-niz { margin-top: auto; padding: 18px 16px max(18px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .75)); }
#kam-zhest { font-size: 26px; font-weight: 650; }
.kam-shkala { height: 6px; margin: 10px 0; border-radius: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
#kam-polosa { height: 100%; background: #fff; transform: scaleX(0); transform-origin: 0 50%; }
#kam-poslednee { min-height: 1.5em; margin: 0; color: var(--fg); }
#kam-sost { margin: 6px 0 0; font-size: 14px; }
#kam-pauza { margin: 6px 0 0; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .14); color: var(--fg); font-size: 14px; }
#kam-pauza[hidden] { display: none; }
.kam-knopki { display: flex; gap: 10px; margin-top: 12px; }
.kam-knopki .knopka { margin: 0; }
#kam-pereklyuchit { flex: 0 0 34%; background: var(--glass-hi); color: var(--fg); border: 1px solid var(--line); }
#s-kam.idet #kam-start { display: none; }
#s-kam.idet #kam-pereklyuchit { flex: 1; }
#kam-kalibr { margin: 10px 0 0; background: var(--glass-hi); color: var(--fg); border: 1px solid var(--line); }
#kam-naoborot { margin: 10px 0 0; background: var(--glass-hi); color: var(--fg); border: 1px solid var(--line); }
#kam-umnye { margin: 10px 0 0; background: var(--glass-hi); color: var(--fg); border: 1px solid var(--line); }
#s-kam:not(.idet) #kam-kalibr, #s-kam:not(.idet) #kam-naoborot, #s-kam:not(.idet) #kam-umnye { display: none; }

<body data-stranica="kamera">

<section id="s-parol" class="ekran on" aria-live="polite">
  <form class="karta" id="parol-forma" autocomplete="off">
    <p class="nadzag">Камера жестов · проект «Точка опоры»</p>

  </div>
</section>

<script>
/* obshchee/svyaz.js */
/* Связь доклада. Общий файл телефона и презентации; перенесён из доклада
   «Портрет» (проверен в сети колледжа 15 и 17.10.2026). У зала телефонов
   нет — связь нужна только пульту докладчика.

   Темы:
     <BASE>-d  телефон о себе для журнала (ОС, сеть, роль, время подключения и
               пробуждения) — только через MQTT.
   Пульт докладчика — свои темы с ключом (temaPulta, temaPultaVid). Темы -s,
   -p, -c остались от прошлых докладов и не используются.

   Надёжность важнее скорости (решение пользователя 04.10.2026): каждое
   сообщение уходит сразу во все каналы, а приёмник слушает все и сам отсеивает
   повторы и устаревшее — по времени t в сообщении. Каналы независимы друг от
   друга: три публичных MQTT-брокера без регистрации и без дневного лимита
   (EMQX, Mosquitto, HiveMQ) и ntfy.sh. У ntfy.sh 250 сообщений в сутки на
   IP-адрес. Лёг один канал — доставят остальные. */
(function (global) {
  'use strict';

  const qs = new URLSearchParams(global.location.search);
  // ?baza=<имя> — свои темы и id экрана, чтобы проверка на настоящих сервисах
  // не задела презентацию пользователя. Не менять BASE без перевыпуска сайта.
  const BASE = qs.get('baza') || 'deviant-547540ee';
  const T = { state: BASE + '-s', wishes: BASE + '-p', chasy: BASE + '-c', diag: BASE + '-d' };
  // Пульт докладчика: команды телефон → презентация и вид для пульта
  // (номер кадра, речь, кнопки кадра) презентация → телефон, с удержанием.
  // Темы с ключом: он есть только в презентации на флешке и в ссылке пульта,
  // в этом файле его нет.
  const temaPulta = (klyuch) => BASE + '-u-' + klyuch;
  const temaPultaVid = (klyuch) => BASE + '-v-' + klyuch;
  // Курсор руки с камеры жестов: до 12 сообщений в секунду — только MQTT.
  const temaKursor = (klyuch) => BASE + '-k-' + klyuch;
  // Что на экране финала (пожелания и рисунки) — пульту, чтобы удалять.
  const temaPultaSpisok = (klyuch) => BASE + '-l-' + klyuch;

  // ?ntfy=/ntfy — подменный ntfy (tools/server.py); ?mqtt=ws://127.0.0.1:<порт>/mqtt —
  // подменный брокер (tools/mqttserver.py), ?mqtt=net — без MQTT.
  // Без них — настоящие сервисы.
  const server = (qs.get('ntfy') || 'https://ntfy.sh').replace(/\/$/, '');
  const MQTT_BROKERY = [
    ['EMQX', 'wss://broker.emqx.io:8084/mqtt'],
    ['Mosquitto', 'wss://test.mosquitto.org:8081/mqtt'],
    ['HiveMQ', 'wss://broker.hivemq.com:8884/mqtt'],
  ];
  const MQTT = qs.has('mqtt')
    ? qs.get('mqtt').split(',').filter((u) => u && u !== 'net').map((u, i) => ['MQTT ' + (i + 1), u])
    : MQTT_BROKERY;

  function rid(n) {
    const a = new Uint8Array(n || 6);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  function deviceId() {
    try {
      let id = localStorage.getItem('deviant-ustroystvo');
      if (!id) { id = rid(6); localStorage.setItem('deviant-ustroystvo', id); }
      return id;
    } catch (e) {
      if (!global.__deviantId) global.__deviantId = rid(6);
      return global.__deviantId;
    }
  }

  // ---- ntfy.sh ----
  // Ответ 429 — дневной лимит сообщений исчерпан. Страницы узнают об этом
  // событием 'deviant-limit'; дальше на этой странице в ntfy не пишем.
  let limit = false;
  let ntfySost = null; // null — подписки нет; 'connecting' | 'open' | 'wait'
  async function ntfyPublish(topic, text) {
    if (limit) { const e = new Error('ntfy: дневной лимит сообщений исчерпан'); e.limit = true; throw e; }
    let r;
    try {
      r = await fetch(server + '/' + topic, { method: 'POST', body: text });
    } catch (e) {
      sobytie('kanal', { imya: 'ntfy', sost: 'otpravka', kod: 'set' });
      throw e;
    }
    if (!r.ok) sobytie('kanal', { imya: 'ntfy', sost: 'otpravka', kod: r.status });
    if (r.status === 429) {
      if (!limit) { limit = true; global.dispatchEvent(new CustomEvent('deviant-limit')); }
      const e = new Error('ntfy: дневной лимит сообщений исчерпан');
      e.limit = true;
      throw e;
    }
    if (!r.ok) throw new Error('ntfy ' + r.status);
  }

  // Подписка на несколько тем одним SSE-соединением. Сама переподключается с
  // паузой и продолжает с последнего полученного сообщения, повторы отсекает.
  // Телефон «просыпается»: вернулись на страницу, разблокировали экран, снова
  // появилась сеть. Соединения за это время могли тихо умереть (телефон в
  // кармане, сменилась сеть), а пауза между попытками — вырасти до 15 с. Каждый
  // канал проверяет себя сразу (пользователь 11.10.2026: пожелания с телефона,
  // пролежавшего в кармане, шли по 2–4 с).
  // Датчики для журнала (zhurnal.js): каналы, пинги, пробуждения. Пока журнал
  // не слушает (Svyaz.naSobytie не задан), ничего не делают.
  let naSobytie = null;
  function sobytie(tip, d) { if (naSobytie) { try { naSobytie(tip, d); } catch (e) { /* журнал не мешает связи */ } } }

  // zanovo — страница была свёрнута дольше 2 с (или вернулась из кэша, или
  // снова появилась сеть): соединения не проверять пингом, а сразу открыть
  // новые. iPhone рвёт сокеты свёрнутой вкладки, а страница этого не видит:
  // пинг ждал ответа до 5 с, и пульт после сворачивания оживал секунд через
  // 6 (пользователь 16.10.2026: «долго ждать, чтобы телефон снова
  // подключился»). Теперь — время одного подключения, ~0,3–1 с.
  const ozhiviteli = new Set();
  function ozhivit(zanovo, skryt) {
    sobytie('ozhivit', { zanovo: !!zanovo, skryt: skryt || 0 });
    ozhiviteli.forEach((f) => { try { f(!!zanovo); } catch (e) { /* остальные каналы — дальше */ } });
  }
  if (typeof document !== 'undefined') {
    let skrytS = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') { skrytS = Date.now(); return; }
      const skryt = skrytS > 0 ? Date.now() - skrytS : 0;
      ozhivit(skryt > 2000, skryt);
      skrytS = 0;
    });
    global.addEventListener('pageshow', (e) => { if (e.persisted) ozhivit(true); });
    global.addEventListener('online', () => ozhivit(true));
  }

  // Код ошибки ntfy для журнала: EventSource его не сообщает, поэтому —
  // короткий запрос тех же тем (poll, без ожидания) и его ответ. Не чаще раза
  // в 30 с и только в презентации (Svyaz.kodyOshibok = true; телефоны тоже
  // слушают события, но им проверка ни к чему): запросы к ntfy.sh тоже на
  // счету его лимита.
  let kodNtfyT = 0, kodyOshibok = false;
  function kodNtfy(topics, otkaz) {
    if (!kodyOshibok) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    if (Date.now() - kodNtfyT < 30000) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    kodNtfyT = Date.now();
    fetch(server + '/' + topics[0] + '/json?poll=1&since=' + Math.floor(Date.now() / 1000), { cache: 'no-store' })
      .then((r) => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: r.status }),
        () => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: 'set' }));
  }

  function ntfySubscribe(topics, since, onMsg, onStatus) {
    let es = null, lastId = null, closed = false, delay = 1000, timer = 0, zhivo = 0;
    const seen = new Set();
    const status = (s) => { ntfySost = s; if (onStatus) onStatus(s); };
    function open() {
      if (closed) return;
      const from = lastId || since;
      es = new EventSource(server + '/' + topics.join(',') + '/sse?since=' + encodeURIComponent(from));
      es.onopen = () => { delay = 1000; zhivo = Date.now(); status('open'); sobytie('kanal', { imya: 'ntfy', sost: 'open' }); };
      es.onmessage = (e) => {
        zhivo = Date.now();
        let m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.event && m.event !== 'message') return;
        if (m.id) {
          if (seen.has(m.id)) return;
          seen.add(m.id);
          lastId = m.id;
        }
        try { onMsg(m.topic, m.message || '', m.time || 0, 'ntfy'); } catch (err) { console.error(err); }
      };
      es.onerror = () => {
        // readyState 2 — браузер закрыл поток сам: сервер ответил не 200
        // (429 — лимит, 5xx); 0 — поток оборвался в сети.
        kodNtfy(topics, es.readyState === 2);
        es.close();
        status('wait');
        if (closed) return;
        clearTimeout(timer);
        timer = setTimeout(open, delay);
        delay = Math.min(delay * 2, 15000);
      };
    }
    // Проснулись: закрытое — открыть сейчас; давно молчавшее — открыть заново
    // (с lastId: что пришло за время сна, придёт, повторы отсекает seen).
    const proverka = (zanovo) => {
      if (closed) return;
      if (zanovo || !es || es.readyState === 2 || (es.readyState === 1 && Date.now() - zhivo > 30000)) {
        if (es) es.close();
        clearTimeout(timer);
        delay = 1000;
        open();
      }
    };
    ozhiviteli.add(proverka);
    status('connecting');
    open();
    return { close() { closed = true; ozhiviteli.delete(proverka); clearTimeout(timer); if (es) es.close(); } };
  }

  // ---- MQTT 3.1.1 поверх WebSocket ----
  // Свой маленький клиент вместо библиотеки: нужно немного — подключиться,
  // подписаться, отправить с удержанием (retain: новый подписчик сразу получает
  // последнее состояние, как since=latest у ntfy), держать связь и сам
  // переподключаться. Одно соединение на брокер на всю страницу.
  const enc = new TextEncoder(), dec = new TextDecoder();
  const dlina = (n) => { const b = []; do { let x = n % 128; n = Math.floor(n / 128); if (n) x |= 128; b.push(x); } while (n); return b; };
  const stroka = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const paket = (tip, telo) => new Uint8Array([tip, ...dlina(telo.length), ...telo]);
  // Пакет с двоичной нагрузкой (кадр камеры) — без разворачивания в массив.
  const paketDvoichno = (tip, zagolovok, dannye) => {
    const dl = dlina(zagolovok.length + dannye.length);
    const u8 = new Uint8Array(1 + dl.length + zagolovok.length + dannye.length);
    u8[0] = tip;
    u8.set(dl, 1);
    u8.set(zagolovok, 1 + dl.length);
    u8.set(dannye, 1 + dl.length + zagolovok.length);
    return u8;
  };

  function mqttKlient(imya, url) {
    const slushateli = new Set(), sledyashchie = new Set(), temy = new Set();
    const dvoichnye = new Set(), dvoichnyeTemy = new Set(); // кадры камеры
    const zhdutUderzh = new Map(), zhdutProchie = [];
    let ws = null, otkryt = false, pauza = 1000, timer = 0, ping = 0, priem = 0, nomer = 0, podklT = 0, pingT = 0;
    let bufer = new Uint8Array(0);
    const k = { imya, mqtt: true, sost: 'connecting' };

    const smenit = (s) => { if (k.sost !== s) { k.sost = s; sledyashchie.forEach((f) => f(s)); } };
    const otpravit = (u8) => { try { if (ws && ws.readyState === 1) { ws.send(u8); return true; } } catch (e) { /* ниже — в очередь */ } return false; };
    function podpiska(tema) {
      nomer = (nomer % 65535) + 1;
      return paket(0x82, [nomer >> 8, nomer & 255, ...stroka(tema), 0]);
    }
    function pozzhe() {
      clearTimeout(timer);
      timer = setTimeout(podklyuchit, pauza);
      pauza = Math.min(pauza * 2, 15000);
    }
    function podklyuchit() {
      if (ws) return;
      let tek;
      try { tek = new WebSocket(url, ['mqtt']); } catch (e) { sobytie('kanal', { imya, sost: 'oshibka' }); smenit('wait'); pozzhe(); return; }
      ws = tek;
      podklT = Date.now();
      tek.binaryType = 'arraybuffer';
      tek.onopen = () => {
        bufer = new Uint8Array(0);
        otpravit(paket(0x10, [...stroka('MQTT'), 4, 2, 0, 60, ...stroka('pt' + rid(6))]));
      };
      tek.onmessage = (e) => { if (ws === tek && e.data instanceof ArrayBuffer) prinyat(new Uint8Array(e.data)); };
      tek.onclose = (e) => {
        if (ws !== tek) return;
        sobytie('kanal', { imya, sost: 'zakryt', kod: e && e.code, prichina: e && e.reason ? String(e.reason).slice(0, 80) : '', bylOtkryt: otkryt, ms: Date.now() - podklT });
        ws = null; otkryt = false; clearInterval(ping);
        smenit('wait');
        pozzhe();
      };
      tek.onerror = () => { /* следом придёт onclose */ };
    }
    function zakrytTekushchee() { try { if (ws) ws.close(); } catch (e) { /* уже закрыто */ } }
    // Соединение умерло — закрыть и подключиться почти сразу, а не через паузу.
    function pereklyuchit() { sobytie('kanal', { imya, sost: 'molchit' }); pauza = 250; zakrytTekushchee(); }
    // Проснулись: нет соединения — подключиться сейчас (пауза могла вырасти до
    // 15 с); есть — пинг, и если за 5 с брокер ничего не прислал, оно мёртвое.
    function proverit(zanovo) {
      if (!temy.size && !zhdutUderzh.size && !zhdutProchie.length) return; // канал ещё не нужен
      if (zanovo && ws) {
        // Старый сокет бросаем, не дожидаясь его закрытия: у «тихо умершего»
        // onclose может прийти не скоро, а его обработчик чужой сокет и так
        // пропускает (ws !== tek).
        sobytie('kanal', { imya, sost: 'zanovo' });
        zakrytTekushchee();
        ws = null; otkryt = false; clearInterval(ping);
      }
      if (!ws) { clearTimeout(timer); pauza = 1000; podklyuchit(); return; }
      if (!otkryt) return; // подключается
      const pered = priem, tek = ws;
      pingT = Date.now();
      otpravit(new Uint8Array([0xc0, 0]));
      setTimeout(() => { if (ws === tek && priem === pered) pereklyuchit(); }, 5000);
    }
    ozhiviteli.add(proverit);
    function prinyat(kusok) {
      priem = Date.now();
      const b = new Uint8Array(bufer.length + kusok.length);
      b.set(bufer);
      b.set(kusok, bufer.length);
      bufer = b;
      for (;;) {
        if (bufer.length < 2) return;
        let dl = 0, mn = 1, i = 1, bayt;
        do {
          if (i >= bufer.length) return; // длина пакета ещё не дошла
          bayt = bufer[i++];
          dl += (bayt & 127) * mn;
          mn *= 128;
        } while ((bayt & 128) && i < 5);
        if (bufer.length < i + dl) return;
        const tip = bufer[0] >> 4, flagi = bufer[0] & 15, telo = bufer.subarray(i, i + dl);
        bufer = bufer.slice(i + dl);
        if (tip === 2) { // CONNACK
          if (telo[1] !== 0) { sobytie('kanal', { imya, sost: 'otkaz', kod: telo[1] }); zakrytTekushchee(); return; }
          otkryt = true;
          pauza = 1000;
          sobytie('kanal', { imya, sost: 'open', ms: Date.now() - podklT });
          temy.forEach((t) => otpravit(podpiska(t)));
          zhdutUderzh.forEach((u8) => otpravit(u8));
          zhdutUderzh.clear();
          zhdutProchie.splice(0).forEach((u8) => otpravit(u8));
          clearInterval(ping);
          // Пинг раз в 10 с; 25 с тишины — два пинга без ответа: соединение
          // умерло (сменилась сеть, телефон спал) — переподключиться сразу.
          // Было 25 и 70 с: телефон по минуте показывал старое (11.10.2026).
          ping = setInterval(() => {
            if (Date.now() - priem > 25000) { pereklyuchit(); return; }
            pingT = Date.now();
            otpravit(new Uint8Array([0xc0, 0]));
          }, 10000);
          smenit('open');
        } else if (tip === 13) { // PINGRESP
          if (pingT) { sobytie('ping', { imya, ms: Date.now() - pingT }); pingT = 0; }
        } else if (tip === 3) { // PUBLISH
          const tl = (telo[0] << 8) | telo[1];
          const tema = dec.decode(telo.subarray(2, 2 + tl));
          let s = 2 + tl;
          if ((flagi >> 1) & 3) s += 2; // QoS > 0: номер пакета
          if (dvoichnyeTemy.has(tema)) { // кадр камеры — как есть, не текст
            const u8 = telo.slice(s);
            dvoichnye.forEach((f) => { try { f(tema, u8); } catch (e) { console.error(e); } });
            continue;
          }
          const tekst = dec.decode(telo.subarray(s));
          slushateli.forEach((f) => { try { f(tema, tekst); } catch (e) { console.error(e); } });
        }
      }
    }
    return {
      k,
      slushat(f) { slushateli.add(f); return () => slushateli.delete(f); },
      sledit(f) { sledyashchie.add(f); f(k.sost); return () => sledyashchie.delete(f); },
      podpisat(tema) {
        if (temy.has(tema)) return;
        temy.add(tema);
        if (otkryt) otpravit(podpiska(tema));
        podklyuchit();
      },
      // Кадры камеры — двоичные и без очереди: не ушёл сейчас — пропущен
      // (живому видео старый кадр не нужен). zanyat — сокет ещё отправляет
      // прошлый: следующий кадр не снимать, иначе очередь растёт. Было 128 КБ —
      // за ними на медленном мобильном интернете копилась секунда-другая
      // «пинга» (пользователь, 08.10.2026); теперь — почти пустой буфер.
      slushatDvoichno(f) { dvoichnye.add(f); return () => dvoichnye.delete(f); },
      podpisatDvoichno(tema) { dvoichnyeTemy.add(tema); this.podpisat(tema); },
      get zanyat() { return !ws || ws.bufferedAmount > 16 * 1024; },
      publikovatDvoichno(tema, u8) {
        podklyuchit();
        if (!otkryt || this.zanyat) return false;
        return otpravit(paketDvoichno(0x30, stroka(tema), u8));
      },
      // true — ушло сразу; иначе ждёт подключения (состояние — только последнее).
      publikovat(tema, tekst, uderzhat) {
        const u8 = paket(0x30 | (uderzhat ? 1 : 0), [...stroka(tema), ...enc.encode(tekst)]);
        podklyuchit();
        if (otkryt && otpravit(u8)) return true;
        if (uderzhat) zhdutUderzh.set(tema, u8);
        else { zhdutProchie.push(u8); if (zhdutProchie.length > 20) zhdutProchie.shift(); }
        return false;
      },
    };
  }
  const mqttKlienty = [];
  function mqttVse() {
    if (!mqttKlienty.length) MQTT.forEach(([imya, url]) => mqttKlienty.push(mqttKlient(imya, url)));
    return mqttKlienty;
  }

  // ---- все каналы вместе ----
  // Отправить во все каналы. Успех — если сообщение ушло хотя бы в один.
  // Состояние доклада — с удержанием: телефон, открывший страницу позже,
  // сразу получает текущую сцену.
  // opts.uderzhat — с удержанием и для другой темы (вид пульта докладчика).
  function publish(topic, text, opts) {
    const uderzhat = topic === T.state || !!(opts && opts.uderzhat);
    let ushlo = false;
    mqttVse().forEach((m) => { if (m.publikovat(topic, text, uderzhat)) ushlo = true; });
    return ntfyPublish(topic, text).then(() => true, (e) => {
      if (ushlo) return true;
      throw e;
    });
  }

  // Подписка сразу на все каналы. onMsg(topic, text, timeSec) зовётся по разу
  // от каждого канала — повторы отсеивает приёмник (по t в сообщении).
  // onStatus('open' — хоть один канал на связи | 'wait' — ни одного, все
  // пробовали). Пока каналы только подключаются, статуса нет.
  function subscribe(topics, since, onMsg, onStatus) {
    const sost = new Map();
    const obnovit = () => {
      const vse = [...sost.values()];
      const s = vse.includes('open') ? 'open' : vse.length && !vse.includes('connecting') ? 'wait' : null;
      if (s && onStatus) onStatus(s);
    };
    const otpiski = [];
    const ntfy = ntfySubscribe(topics, since, onMsg, (s) => { sost.set('ntfy', s); obnovit(); });
    mqttVse().forEach((m) => {
      otpiski.push(m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, Date.now() / 1000, m.k.imya); }));
      otpiski.push(m.sledit((s) => { sost.set(m.k.imya, s); obnovit(); }));
      topics.forEach((t) => m.podpisat(t));
    });
    return { close() { ntfy.close(); otpiski.forEach((f) => f()); } };
  }

  // ---- только через MQTT-брокеры, мимо ntfy и его дневного лимита ----
  // Штрихи часов, пока человек рисует: по сообщению раз в ~0,4 с с каждого
  // телефона зала — ntfy такого не выдержит (250 в сутки на IP).
  function publishMqtt(topic, text, uderzhat) { mqttVse().forEach((m) => m.publikovat(topic, text, !!uderzhat)); }
  function subscribeMqtt(topics, onMsg) {
    const otpiski = mqttVse().map((m) => {
      const f = m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, m.k.imya); });
      topics.forEach((tm) => m.podpisat(tm));
      return f;
    });
    return { close() { otpiski.forEach((f) => f()); } };
  }

  // Каналы и их состояние — для подписей на экране докладчика.
  function kanaly() {
    const ks = mqttKlienty.map((m) => ({ imya: m.k.imya, mqtt: true, sost: m.k.sost }));
    if (ntfySost) ks.push({ imya: 'ntfy', mqtt: false, sost: limit ? 'limit' : ntfySost });
    return ks;
  }
  // Дойдёт ли команда до телефонов: 'da' | 'limit' | 'zhdu' | 'net'. Подписка
  // ntfy жива и при исчерпанном лимите — но отправить в него уже нельзя.
  function dostavka() {
    const ks = kanaly();
    if (ks.some((k) => k.mqtt && k.sost === 'open')) return 'da';
    if (limit) return 'limit';
    if (ks.some((k) => k.sost === 'open')) return 'da';
    if (ks.some((k) => k.sost === 'connecting')) return 'zhdu';
    return 'net';
  }


  global.Svyaz = {
    BASE, T, server, deviceId, publish, subscribe, kanaly, dostavka, temaPulta, temaPultaVid, temaKursor, temaPultaSpisok, ozhivit,
    publishMqtt, subscribeMqtt,
    set naSobytie(f) { naSobytie = f; },
    set kodyOshibok(v) { kodyOshibok = !!v; },
    get limit() { return limit; },
  };
})(window);

<script>
/* obshchee/zhesty.js */
/* Жесты из потока распознавания → события. Модель каждый кадр называет жест
   руки («Closed_Fist», «Open_Palm», …) с уверенностью и даёт точки кисти.
   События (пользователь 26.10.2026: «как у Тони Старка» — смять и бросить):
     kulak   — кулак держат не меньше uderzhat мс (руки, которыми просто
               жестикулируют, не срабатывают); с точкой кисти x, y;
     razzhal — кулак разжали (не кулак дольше otpusk мс);
     vzmah   — кисть прошла по горизонтали не меньше shag доли кадра за okno мс
               (и почти не по вертикали); napr — 'vpravo' / 'vlevo' с точки
               зрения докладчика: камера смотрит на него, поэтому его «вправо» —
               уменьшение x в кадре. naoborot — если на телефоне окажется иначе.
   Пока показывают пальцем (курсор), взмахов нет. Короткие пропуски
   распознавания (до propusk мс) кулак не сбрасывают. Без браузера и камеры:
   проверяется подачей кадров с отметками времени. */
(function (global) {
  'use strict';

  function sozdat(nastrojki) {
    const n = Object.assign({
      uderzhat: 300, otpusk: 250, propusk: 150, porog: 0.6,
      shag: 0.15, okno: 450, pauzaVzmaha: 900, naoborot: false,
    }, nastrojki);
    let kulakS = 0, kulakPosl = -Infinity, szhat = false;
    let sled = [], poslVzmah = -Infinity;
    return {
      nastrojki: n,
      // kategoriya — имя жеста модели (null — руки нет), t — мс,
      // ruka — {x, y} центр кисти в кадре (0…1) или null; dveRuki — в кадре две
      // кисти: это жест для умного режима («развести руки»), не взмах.
      // Возвращает список событий этого кадра (обычно пустой).
      podat(kategoriya, uverennost, t, ruka, dveRuki) {
        const sob = [];
        const kulak = kategoriya === 'Closed_Fist' && uverennost >= n.porog;
        if (kulak) {
          if (t - kulakPosl > n.propusk) kulakS = t; // новый кулак
          kulakPosl = t;
          if (!szhat && t - kulakS >= n.uderzhat) {
            szhat = true;
            sob.push({ z: 'kulak', x: ruka ? ruka.x : 0.5, y: ruka ? ruka.y : 0.5 });
          }
        } else if (szhat && t - kulakPosl >= n.otpusk) {
          szhat = false;
          sob.push({ z: 'razzhal' });
        }
        // Взмах: след кисти за последние okno мс.
        if (ruka && kategoriya !== 'Pointing_Up' && !dveRuki) {
          sled.push({ x: ruka.x, y: ruka.y, t });
          while (sled.length && t - sled[0].t > n.okno) sled.shift();
          const p = sled[0];
          const dx = ruka.x - p.x, dy = ruka.y - p.y;
          if (Math.abs(dx) >= n.shag && Math.abs(dy) <= Math.abs(dx) * 0.6 && t - poslVzmah >= n.pauzaVzmaha) {
            poslVzmah = t;
            sled = [];
            const vpravo = (dx < 0) !== n.naoborot;
            sob.push({ z: 'vzmah', napr: vpravo ? 'vpravo' : 'vlevo' });
          }
        } else sled = [];
        return sob;
      },
      // Для экрана камеры: сжат ли кулак и насколько (0…1) до срабатывания.
      sostoyanie(t) {
        if (szhat) return { zhest: 'kulak', dolya: 1 };
        if (t - kulakPosl <= n.propusk) return { zhest: 'kulak', dolya: Math.min(1, (t - kulakS) / n.uderzhat) };
        return { zhest: null, dolya: 0 };
      },
    };
  }

  global.Zhesty = { sozdat };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* obshchee/dvizhenie.js */
/* Умный режим жестов (вариант 1, пользователь 26.10.2026): телефон находит
   позу (плечи, локти, запястья) и кисти, нарезает «движения-команды» и
   отправляет на ПК их краткое описание — не видео. Нейросеть на ПК решает,
   что сделать со слайдом.
   Команда — когда хоть одно запястье выше своего локтя (руку подняли перед
   собой); жестикуляция у пояса — не команда. Движение начинается, если рука
   поднята дольше start мс, и заканчивается, когда руки замерли на tishina мс
   (после хотя бы minimum мс), опустились дольше otpusk мс или прошло maks мс.
   Координаты — с точки зрения докладчика: x вправо от центра плеч, y вверх,
   в ширинах плеч. После движения новое начинается, только когда руки
   опустили или сдвинули дальше posle ширин плеч: руки, которые просто держат
   поднятыми, не шлют «движения» одно за другим. Без браузера и камеры:
   проверяется подачей кадров. */
(function (global) {
  'use strict';
  const STORONY = { levaya: [15, 13], pravaya: [16, 14] }; // запястье, локоть (MediaPipe Pose)

  // Сколько пальцев разогнуто: кончик дальше от запястья, чем средний сустав.
  function paltsy(lm) {
    if (!lm || lm.length < 21) return 0;
    const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
    let n = 0;
    for (const [tip, pip] of [[8, 6], [12, 10], [16, 14], [20, 18]]) if (d(tip, 0) > d(pip, 0) * 1.12) n++;
    if (d(4, 17) > d(3, 17) * 1.08 && d(4, 5) > d(3, 5)) n++; // большой
    return n;
  }

  function sozdat(nastrojki) {
    const n = Object.assign({ start: 150, tishina: 300, minimum: 400, otpusk: 200, maks: 2000, korotko: 250, posle: 0.4 }, nastrojki);
    let aktivS = 0, passivS = 0, seg = null, posleKonca = null;
    function ruka(kadr, w) {
      // кисть, ближайшая к запястью позы
      let luchshaya = null, min = 0.12;
      for (const r of kadr.ruki || []) {
        const d = Math.hypot(r.lm[0].x - w.x, r.lm[0].y - w.y);
        if (d < min) { min = d; luchshaya = r; }
      }
      return luchshaya;
    }
    function opisat(t) {
      const ruki = {};
      for (const [s, smpl] of Object.entries(seg.sled)) {
        if (!smpl.length) continue;
        const shag = Math.max(1, Math.floor(smpl.length / 8));
        const put = smpl.filter((_, i) => i % shag === 0).slice(0, 8).map((p) => [+p.x.toFixed(2), +p.y.toFixed(2)]);
        const posl = smpl[smpl.length - 1];
        if (put.length && (put[put.length - 1][0] !== +posl.x.toFixed(2) || put[put.length - 1][1] !== +posl.y.toFixed(2))) put.push([+posl.x.toFixed(2), +posl.y.toFixed(2)]);
        const formy = [smpl[0].forma, smpl[Math.floor(smpl.length / 2)].forma, posl.forma];
        ruki[s] = { put, formy, paltsev: posl.paltsev };
      }
      const op = { dlit: Math.round(t - seg.t0), ruki };
      if (seg.mezhdu.length >= 2) op.mezhdu = [seg.mezhdu[0], seg.mezhdu[seg.mezhdu.length - 1]].map((v) => +v.toFixed(2));
      op.tochka = seg.tochka;
      return op;
    }
    return {
      // kadr: { poza: 33 точки или null, ruki: [{ lm: 21 точка, kat, uv }] }; t — мс.
      // Возвращает { nachalo: {x, y} } при начале движения, { konec: описание }
      // в конце, { otmena: true } для слишком короткого, иначе null.
      podat(kadr, t) {
        const p = kadr.poza;
        const podnyaty = [];
        if (p) {
          for (const [s, [iw, ie]] of Object.entries(STORONY)) {
            const w = p[iw], e = p[ie];
            if (w && e && (w.visibility === undefined || w.visibility > 0.5) && w.y < e.y - 0.02) podnyaty.push(s);
          }
        }
        if (podnyaty.length) { if (!aktivS) aktivS = t; passivS = 0; } else { aktivS = 0; if (!passivS) passivS = t; }
        if (!seg && posleKonca) {
          // ждём, пока руки опустят или сдвинут
          if (!podnyaty.length) posleKonca = null;
          else {
            const W = Math.max(0.05, Math.hypot(p[11].x - p[12].x, p[11].y - p[12].y));
            const sdvig = Math.max(...podnyaty.map((s) => {
              const w = p[STORONY[s][0]], b = posleKonca[s];
              return b ? Math.hypot(w.x - b.x, w.y - b.y) / W : Infinity;
            }));
            if (sdvig < n.posle) return null;
            posleKonca = null;
            aktivS = t - n.start; // движение уже идёт — начинаем сразу
          }
        }
        if (!seg) {
          if (!aktivS || t - aktivS < n.start) return null;
          seg = { t0: t, sled: { levaya: [], pravaya: [] }, mezhdu: [], tochka: null, tihoS: 0 };
        }
        const nov = seg.sled.levaya.length + seg.sled.pravaya.length === 0;
        if (p && podnyaty.length) {
          const c = { x: (p[11].x + p[12].x) / 2, y: (p[11].y + p[12].y) / 2 };
          const W = Math.max(0.05, Math.hypot(p[11].x - p[12].x, p[11].y - p[12].y));
          let sx = 0, sy = 0;
          for (const s of podnyaty) {
            const w = p[STORONY[s][0]];
            const r = ruka(kadr, w);
            // камера смотрит на докладчика: его «вправо» — меньше x в кадре
            seg.sled[s].push({ x: -(w.x - c.x) / W, y: -(w.y - c.y) / W, t, forma: r ? r.kat || 'ruka' : 'ruka', paltsev: r ? paltsy(r.lm) : 0 });
            sx += w.x; sy += w.y;
          }
          seg.tochka = { x: +(sx / podnyaty.length).toFixed(3), y: +(sy / podnyaty.length).toFixed(3) };
          if (podnyaty.length === 2) seg.mezhdu.push(Math.hypot(p[15].x - p[16].x, p[15].y - p[16].y) / W);
          // руки замерли?
          let dvizh = 0;
          for (const s of podnyaty) {
            const sl = seg.sled[s], posl = sl[sl.length - 1];
            const ran = sl.find((q) => posl.t - q.t <= n.tishina) || posl;
            dvizh = Math.max(dvizh, Math.hypot(posl.x - ran.x, posl.y - ran.y));
          }
          if (dvizh < 0.08) { if (!seg.tihoS) seg.tihoS = t; } else seg.tihoS = 0;
        }
        if (nov && seg.tochka) return { nachalo: seg.tochka };
        const dlit = t - seg.t0;
        const konec = (passivS && t - passivS >= n.otpusk) || dlit >= n.maks
          || (seg.tihoS && t - seg.tihoS >= n.tishina && dlit >= n.minimum);
        if (!konec) return null;
        const op = opisat(t);
        seg = null;
        aktivS = 0;
        posleKonca = p && !passivS ? { levaya: { x: p[15].x, y: p[15].y }, pravaya: { x: p[16].x, y: p[16].y } } : null;
        if (op.dlit < n.korotko || !Object.keys(op.ruki).length) return { otmena: true };
        return { konec: op };
      },
      // Сработал быстрый жест (кулак, взмах) — это движение нейросети не нужно.
      sbrosit() { seg = null; aktivS = 0; posleKonca = null; },
      get idet() { return !!seg; },
    };
  }

  global.Dvizhenie = { sozdat, paltsy };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* obshchee/kamera.js */
/* Камера жестов. Два места:
   - внутри пульта (telefon.html): кнопка «Камера и микрофон» — тот же
     телефон, фронтальная камера, ключ берётся у пульта (window.Kamera);
   - отдельной страницей kamera.html (<body data-stranica="kamera">) — второй
     телефон на штативе:
       #kam=<ключ>  QR по U в презентации: без пароля;
       без метки    спросит пароль пульта (или возьмёт запомненный ключ пульта).
   Руки распознаёт модель Google MediaPipe прямо на телефоне: видео никуда не
   уходит. На презентацию — только события (zhesty.js): кулак (слайд
   сминается в комок у руки), разжал (разворачивается), взмах вправо / влево
   (листание; с комком в руке — бросок). Команды — в тему пульта, как кнопки
   пульта: презентация их не отличает от пульта, кроме k: 'zhest'.
   Умные жесты (dvizhenie.js): модель позы находит плечи, локти и запястья;
   движение поднятой рукой уходит на презентацию описанием (k: 'dvizhenie'),
   а та — в нейросеть на ПК. Начало движения — сразу (k: 'dvizh'), чтобы слайд
   откликнулся мгновенно. Выключатель — «Умные жесты» в меню камеры.
   Курсор: поднятый указательный палец ведёт точку по слайду. Кончик пальца
   переводится в координаты экрана по калибровке — докладчик указывает на
   левый верхний и правый нижний углы экрана. Точка — не чаще 12 раз в
   секунду и только через MQTT (у ntfy дневной лимит). */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35';
  const MODEL = 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task';
  const MODEL_POZY = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  const UMNYE_KEY = 'deviant-umnye-zhesty';
  const KAM = (/^#kam=([0-9a-f]{16})$/.exec(location.hash) || [])[1] || null;
  const PULT_KEY = 'deviant-pult-klyuch'; // тот же, что у пульта: один пароль на оба
  const NAZVANIYA = { kulak: 'Кулак — слайд смят', razzhal: 'Разжал — слайд развёрнут', vpravo: 'Взмах вправо — дальше', vlevo: 'Взмах влево — назад' };
  const NAOBOROT_KEY = 'deviant-vzmahi-naoborot';
  // Отдельная страница камеры — или камера внутри пульта (экранами там правит telefon.js).
  const SAMA = document.body.dataset.stranica === 'kamera';
  if (SAMA) window.addEventListener('hashchange', () => location.reload());

  function pokazat(id) {
    if (!SAMA) return;
    for (const e of ['s-parol', 's-kam']) $(e).classList.toggle('on', e === id);
  }

  let zamok = null;
  async function bodrstvovat() {
    try {
      if (!zamok && navigator.wakeLock) {
        zamok = await navigator.wakeLock.request('screen');
        zamok.addEventListener('release', () => { zamok = null; });
      }
    } catch (e) { /* не дали — не страшно */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && kamera) bodrstvovat(); });

  // ---- связь: ключ пульта, вид презентации ----
  let svyaz = null, nomer = 0, tVid = 0;
  async function klyuchIzParolya(parol) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('deviant-pult:' + parol));
    return Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('').slice(0, 16);
  }
  function otpravit(kom) {
    if (!svyaz || Svyaz.dostavka() !== 'da') return false;
    kom.v = 1;
    kom.t = Date.now();
    kom.id = Svyaz.deviceId() + '-k' + Date.now().toString(36) + '-' + nomer++;
    Svyaz.publish(svyaz.tema, JSON.stringify(kom)).catch(() => {});
    return true;
  }
  // proverka — пароль только что ввели: пришёл вид презентации по этому ключу — верный.
  function podklyuchit(klyuch, proverka) {
    if (svyaz && svyaz.klyuch === klyuch && !proverka) return; // уже на этом ключе
    if (svyaz) svyaz.podpiska.close();
    const moy = { klyuch, tema: Svyaz.temaPulta(klyuch), proverka };
    svyaz = moy;
    let proverkaT = 0;
    if (proverka) {
      proverkaT = setTimeout(() => {
        if (svyaz !== moy || !moy.proverka) return;
        moy.proverka = null;
        sprositParol('Нет ответа: неверный пароль — или презентация на компьютере не открыта');
      }, 8000);
    } else pokazat('s-kam');
    moy.podpiska = Svyaz.subscribe([Svyaz.temaPultaVid(klyuch)], 'latest', (tema, tekst) => {
      if (svyaz !== moy) return;
      let s;
      try { s = JSON.parse(tekst); } catch (e) { return; }
      if (!s || !s.t) return;
      if (moy.proverka) {
        moy.proverka = null;
        clearTimeout(proverkaT);
        try { localStorage.setItem(PULT_KEY, klyuch); } catch (e) { /* без памяти */ }
        pokazat('s-kam');
      }
      if (s.t <= tVid) return;
      tVid = s.t;
      $('kam-kadr').textContent = s.n + ' / ' + s.N + ' · ' + (s.zag || '');
      $('s-kam').classList.toggle('pauza', s.zhesty === false);
      $('kam-pauza').hidden = s.zhesty !== false;
    }, (st) => {
      if (svyaz !== moy) return;
      $('s-kam').classList.toggle('da', st === 'open');
      $('kam-svyaz').textContent = st === 'open' ? 'На связи' : 'Нет связи — проверьте интернет';
      if (st === 'open') otpravit({ k: 'kamera', sost: kamera ? 'idet' : 'podklyuchena' });
    });
  }
  function sprositParol(oshibka) {
    if (svyaz) { svyaz.podpiska.close(); svyaz = null; }
    $('parol').value = '';
    $('parol-itog').textContent = oshibka || '';
    pokazat('s-parol');
  }

  // ---- курсор: калибровка и точка ----
  // Калибровка — две точки в координатах камеры (0…1): куда указывал палец,
  // когда докладчик показывал на углы экрана. Сохраняется в телефоне.
  const KALIBR_KEY = 'deviant-kalibr';
  let kalibr = null, kalibrEtap = 0, uderzhanie = null, kursorT = 0, kursorViden = false, palecT = 0;
  try { kalibr = JSON.parse(localStorage.getItem(KALIBR_KEY) || 'null'); } catch (e) { kalibr = null; }
  const UGLY = { 1: 'левый верхний', 2: 'правый нижний' };
  function kalibrovka(etap) {
    kalibrEtap = etap;
    uderzhanie = null;
    otpravit({ k: 'kalibr', etap });
    $('kam-kalibr').textContent = etap ? 'Отменить калибровку' : (kalibr ? 'Калибровка ✓ (заново)' : 'Калибровка курсора');
    if (etap) $('kam-sost').textContent = 'Укажите пальцем на ' + UGLY[etap] + ' угол экрана и держите секунду';
  }
  // Палец держат неподвижно секунду — точка угла записана.
  function kalibrPalec(x, y, t) {
    if (!uderzhanie || Math.hypot(x - uderzhanie.x, y - uderzhanie.y) > 0.04) { uderzhanie = { x, y, t }; return; }
    if (t - uderzhanie.t < 1000) return;
    if (navigator.vibrate) navigator.vibrate(40);
    if (kalibrEtap === 1) { kalibr = { a: { x, y } }; kalibrovka(2); return; }
    kalibr.b = { x, y };
    if (Math.abs(kalibr.b.x - kalibr.a.x) < 0.05 || Math.abs(kalibr.b.y - kalibr.a.y) < 0.05) {
      kalibr = null;
      kalibrovka(1);
      $('kam-sost').textContent = 'Углы слишком близко — встаньте ближе к камере и укажите ещё раз: левый верхний угол';
      return;
    }
    try { localStorage.setItem(KALIBR_KEY, JSON.stringify(kalibr)); } catch (e) { /* без памяти */ }
    kalibrovka(0);
    $('kam-sost').textContent = 'Курсор готов: поднимите указательный палец';
  }
  // Координаты камеры → доля экрана по калибровке; за краем — к краю.
  function naEkran(x, y) {
    const k = (v, a, b) => Math.max(0, Math.min(1, (v - a) / (b - a)));
    return [k(x, kalibr.a.x, kalibr.b.x), k(y, kalibr.a.y, kalibr.b.y)];
  }
  function kursor(x, y, t) {
    if (!svyaz || (t >= kursorT && t - kursorT < 80)) return; // время пошло назад — не ждать
    kursorT = t;
    kursorViden = true;
    Svyaz.publishMqtt(Svyaz.temaKursor(svyaz.klyuch), JSON.stringify({ x: +x.toFixed(4), y: +y.toFixed(4), t: Date.now() }));
  }
  function kursorSkryt() {
    if (!kursorViden || !svyaz) return;
    kursorViden = false;
    Svyaz.publishMqtt(Svyaz.temaKursor(svyaz.klyuch), JSON.stringify({ skryt: 1, t: Date.now() }));
  }
  // Кончик указательного пальца (точка 8) руки, которая показывает «палец вверх».
  function palec(rez) {
    const g = rez.gestures || [];
    for (let i = 0; i < g.length; i++) {
      const c = g[i] && g[i][0];
      if (c && c.categoryName === 'Pointing_Up' && c.score > 0.5 && rez.landmarks[i]) return rez.landmarks[i][8];
    }
    return null;
  }

  // ---- камера и распознавание ----
  let naoborot = false;
  try { naoborot = localStorage.getItem(NAOBOROT_KEY) === '1'; } catch (e) { /* без памяти */ }
  const avtomat = Zhesty.sozdat({ naoborot });
  // Внутри пульта телефон смотрит экраном на докладчика — фронтальная камера.
  let kamera = null, raspoznavatel = null, poza = null, potok = null, perednyaya = !SAMA, poslT = -1;
  let umnye = true, kadrN = 0, poslPoza = null, dvN = 0;
  try { umnye = localStorage.getItem(UMNYE_KEY) !== '0'; } catch (e) { /* без памяти */ }
  const narezka = Dvizhenie.sozdat();
  const holst = $('kam-ruki'), ctx = holst.getContext('2d');
  async function zagruzitModel() {
    $('kam-sost').textContent = 'Загружаю модель (около 20 МБ, один раз)…';
    const vision = await import(MP + '/vision_bundle.mjs');
    const fs = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const opcii = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL, delegate },
      runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    // Поза — для умных жестов; не загрузилась — простые жесты работают и без неё.
    const opciiPozy = (delegate) => ({ baseOptions: { modelAssetPath: MODEL_POZY, delegate }, runningMode: 'VIDEO', numPoses: 1 });
    vision.PoseLandmarker.createFromOptions(fs, opciiPozy('GPU'))
      .catch(() => vision.PoseLandmarker.createFromOptions(fs, opciiPozy('CPU')))
      .then((m) => { poza = m; }, () => { poza = null; });
    try { return await vision.GestureRecognizer.createFromOptions(fs, opcii('GPU')); }
    catch (e) { return vision.GestureRecognizer.createFromOptions(fs, opcii('CPU')); }
  }
  // Движение для нейросети: только через MQTT (у ntfy дневной лимит), с id —
  // повтор с другого брокера презентация отсекает.
  function otpravitMqtt(kom) {
    if (!svyaz) return;
    kom.v = 1;
    kom.t = Date.now();
    kom.id = Svyaz.deviceId() + '-d' + Date.now().toString(36) + '-' + dvN++;
    Svyaz.publishMqtt(svyaz.tema, JSON.stringify(kom));
  }
  function umnoe(otvet) {
    if (!otvet) return;
    if (otvet.nachalo) {
      const [x, y] = tochkaEkrana(otvet.nachalo);
      otpravitMqtt({ k: 'dvizh', faza: 'nachalo', x: +x.toFixed(3), y: +y.toFixed(3) });
    } else if (otvet.otmena) otpravitMqtt({ k: 'dvizh', faza: 'otmena' });
    else if (otvet.konec) {
      const d = otvet.konec;
      if (d.tochka) [d.tochka.x, d.tochka.y] = tochkaEkrana(d.tochka).map((v) => +v.toFixed(3));
      otpravitMqtt({ k: 'dvizhenie', d });
      poslSobytie = 'Движение → нейросеть';
      poslSobytieT = performance.now();
    }
  }
  async function vklyuchitKameru() {
    if (potok) potok.getTracks().forEach((t) => t.stop());
    potok = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: perednyaya ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    });
    const v = $('kam-video');
    v.srcObject = potok;
    v.classList.toggle('zerkalo', perednyaya);
    holst.classList.toggle('zerkalo', perednyaya);
    await v.play();
  }
  async function start() {
    $('kam-start').disabled = true;
    bodrstvovat();
    try {
      await vklyuchitKameru();
      if (!raspoznavatel) raspoznavatel = await zagruzitModel();
    } catch (e) {
      // Причину — крупно на экране и в журнал презентации: так видно, что не
      // так на конкретном телефоне (iPhone, Android), не подключая его к ПК.
      const imya = e && e.name, soob = String((e && e.message) || e || '').slice(0, 120);
      $('kam-sost').textContent = 'Камера не включилась: ' + (imya === 'NotAllowedError' ? 'нет разрешения на камеру — разрешите в настройках браузера'
        : imya === 'NotReadableError' ? 'камера занята другим приложением или микрофоном' : soob || imya);
      $('s-kam').classList.add('oshibka', 'menu');
      otpravit({ k: 'kamera', sost: 'oshibka', tekst: String(imya || '') + ': ' + soob });
      $('kam-start').disabled = false;
      return;
    }
    kamera = true;
    $('s-kam').classList.remove('oshibka');
    $('s-kam').classList.add('idet');
    $('kam-sost').textContent = 'Кулак — смять слайд, взмах рукой — листать';
    otpravit({ k: 'kamera', sost: 'idet' });
    requestAnimationFrame(kadr);
  }

  function risovat(rez) {
    const v = $('kam-video');
    if (holst.width !== v.videoWidth) { holst.width = v.videoWidth; holst.height = v.videoHeight; }
    ctx.clearRect(0, 0, holst.width, holst.height);
    ctx.fillStyle = '#fff';
    for (const ruka of rez.landmarks || []) {
      for (const tochka of ruka) {
        ctx.beginPath();
        ctx.arc(tochka.x * holst.width, tochka.y * holst.height, Math.max(3, holst.width / 220), 0, 2 * Math.PI);
        ctx.fill();
      }
    }
  }
  // Рука, за которой следим: первая в кадре. Её жест и центр кисти (запястье и
  // основания указательного и мизинца).
  function ruka(rez) {
    const l = rez.landmarks && rez.landmarks[0];
    if (!l) return [null, 0, null];
    const c = rez.gestures && rez.gestures[0] && rez.gestures[0][0];
    const x = (l[0].x + l[5].x + l[17].x) / 3, y = (l[0].y + l[5].y + l[17].y) / 3;
    return [c ? c.categoryName : null, c ? c.score : 0, { x, y }];
  }
  // Точка руки на экране: по калибровке курсора, без неё — зеркально по кадру
  // (камера смотрит на докладчика).
  function tochkaEkrana(r) {
    if (kalibr && kalibr.b) return naEkran(r.x, r.y);
    return [1 - r.x, r.y];
  }
  function sobytiya(sob, t) {
    for (const s of sob) {
      const kom = { k: 'zhest', z: s.z };
      if (s.z === 'kulak') [kom.x, kom.y] = tochkaEkrana(s).map((v) => +v.toFixed(3));
      if (s.z === 'vzmah') kom.napr = s.napr;
      const ushlo = otpravit(kom);
      if (navigator.vibrate) navigator.vibrate(30);
      poslSobytie = NAZVANIYA[s.z === 'vzmah' ? s.napr : s.z] + (ushlo ? '' : ' — нет связи, не ушло');
      poslSobytieT = t;
    }
  }
  let poslSobytie = '', poslSobytieT = 0;
  function ostanovit() {
    kamera = null;
    kursorSkryt();
    if (potok) potok.getTracks().forEach((t) => t.stop());
    potok = null;
    $('s-kam').classList.remove('idet');
    $('kam-start').disabled = false;
    $('kam-zhest').textContent = 'Камера выключена';
  }
  function kadr() {
    if (!kamera) return; // камеру выключили
    const v = $('kam-video');
    const t = performance.now();
    if (v.readyState >= 2 && v.currentTime !== poslT) {
      poslT = v.currentTime;
      const rez = raspoznavatel.recognizeForVideo(v, t);
      risovat(rez);
      const [kat, uv, r] = ruka(rez);
      const bystrye = avtomat.podat(kat, uv, t, r, !!(rez.landmarks && rez.landmarks.length > 1));
      sobytiya(bystrye, t);
      // Умные жесты: поза — через кадр (телефону легче). Пока кулак сжат, сработал
      // быстрый жест или показывают пальцем (курсор) — движение нейросети не нужно.
      if (umnye && poza) {
        if (kadrN++ % 2 === 0) {
          const pr = poza.detectForVideo(v, t + 0.5);
          poslPoza = pr.landmarks && pr.landmarks[0] ? pr.landmarks[0] : null;
        }
        const kulak = avtomat.sostoyanie(t).zhest === 'kulak';
        if (bystrye.length || kulak || kat === 'Pointing_Up') {
          if (narezka.idet) otpravitMqtt({ k: 'dvizh', faza: 'otmena' });
          narezka.sbrosit();
        } else {
          const ruki = (rez.landmarks || []).map((lm, i) => {
            const c = rez.gestures && rez.gestures[i] && rez.gestures[i][0];
            return { lm, kat: c && c.score > 0.5 ? c.categoryName : 'None' };
          });
          umnoe(narezka.podat({ poza: poslPoza, ruki }, t));
        }
      }
      const p = palec(rez);
      if (p) {
        palecT = t;
        if (kalibrEtap) kalibrPalec(p.x, p.y, t);
        else if (kalibr && kalibr.b) kursor(...naEkran(p.x, p.y), t);
      } else if (t - palecT > 300) kursorSkryt();
      const s = avtomat.sostoyanie(t);
      $('kam-zhest').textContent = s.zhest ? (s.dolya >= 1 ? NAZVANIYA.kulak : 'Кулак…')
        : p ? (kalibrEtap ? 'Палец — держите на углу' : kalibr ? 'Палец — курсор' : 'Палец — сначала калибровка')
          : (rez.landmarks && rez.landmarks.length ? 'Рука видна' : 'Рук не видно');
      $('kam-polosa').style.transform = 'scaleX(' + s.dolya.toFixed(3) + ')';
      // Датчики чистого режима: рука в кадре, кулак сжат.
      $('s-kam').classList.toggle('ruka', !!(rez.landmarks && rez.landmarks.length));
      $('s-kam').classList.toggle('kulak', s.dolya >= 1);
      $('kam-poslednee').textContent = t - poslSobytieT < 4000 ? poslSobytie : '';
    }
    requestAnimationFrame(kadr);
  }

  // ---- старт ----
  $('kam-start').onclick = start;
  function umnyeVid() { $('kam-umnye').textContent = umnye ? 'Умные жесты: вкл' : 'Умные жесты: выкл'; }
  $('kam-umnye').onclick = () => {
    umnye = !umnye;
    narezka.sbrosit();
    try { localStorage.setItem(UMNYE_KEY, umnye ? '1' : '0'); } catch (e) { /* без памяти */ }
    umnyeVid();
  };
  umnyeVid();
  // Взмахи наоборот — если на этом телефоне «вправо» распозналось как «влево».
  function naoborotVid() { $('kam-naoborot').textContent = naoborot ? 'Взмахи: наоборот ✓' : 'Перевернуть взмахи'; }
  $('kam-naoborot').onclick = () => {
    naoborot = !naoborot;
    avtomat.nastrojki.naoborot = naoborot;
    try { localStorage.setItem(NAOBOROT_KEY, naoborot ? '1' : '0'); } catch (e) { /* без памяти */ }
    naoborotVid();
  };
  naoborotVid();
  $('kam-kalibr').onclick = () => kalibrovka(kalibrEtap ? 0 : 1);
  $('kam-kalibr').textContent = kalibr && kalibr.b ? 'Калибровка ✓ (заново)' : 'Калибровка курсора';
  $('kam-pereklyuchit').onclick = async () => {
    perednyaya = !perednyaya;
    if (kamera) { try { await vklyuchitKameru(); } catch (e) { $('kam-sost').textContent = 'Камера не переключилась'; } }
  };
  if (SAMA) $('parol-forma').onsubmit = async (e) => {
    e.preventDefault();
    const parol = $('parol').value.trim();
    if (!parol) return;
    if (!(window.crypto && crypto.subtle)) { $('parol-itog').textContent = 'Откройте через QR-код: нужна ссылка https'; return; }
    $('parol-itog').textContent = 'Проверяю…';
    podklyuchit(await klyuchIzParolya(parol), true);
  };
  if (SAMA) {
    let sohr = null;
    try { sohr = localStorage.getItem(PULT_KEY); } catch (e) { /* без памяти */ }
    if (KAM) podklyuchit(KAM, false);
    else if (/^[0-9a-f]{16}$/.test(sohr || '')) podklyuchit(sohr, false);
    else sprositParol('');
  }
  // Для пульта: включить камеру на его ключе и выключить.
  window.Kamera = {
    vklyuchit(klyuch) { podklyuchit(klyuch, false); return start(); },
    ostanovit,
    get idet() { return !!kamera; },
    // короткая подпись внизу экрана камеры (на 4 с)
    podpis(tekst) { poslSobytie = tekst; poslSobytieT = performance.now(); $('kam-poslednee').textContent = tekst; },
  };

  // Для проверок: подать распознанный жест, как будто его увидела камера.
  window.__kam = {
    // кадр распознавания: жест, уверенность, время, центр кисти в кадре
    podat(kat, uv, t, x, y) {
      const sob = avtomat.podat(kat, uv, t, x == null ? null : { x, y: y == null ? 0.5 : y });
      sobytiya(sob, t);
      return sob.map((s) => s.z === 'vzmah' ? s.napr : s.z);
    },
    // палец в координатах камеры (0…1) — как будто его увидела камера
    palec(x, y, t) {
      if (kalibrEtap) kalibrPalec(x, y, t);
      else if (kalibr && kalibr.b) kursor(...naEkran(x, y), t);
    },
    kalibrovka,
    kursorSkryt,
    // готовое описание движения — как будто его нарезала камера
    dvizhenie(d) { umnoe({ konec: d }); },
    nachalo(x, y) { umnoe({ nachalo: { x, y } }); },
    get pozaGotova() { return !!poza; },
    get kalibr() { return kalibr; },
  };
})();
</script>
</body>
</html>
