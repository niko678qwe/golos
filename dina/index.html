<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<title>Поздравьте Дину</title>
<style>
:root {
  --bg: #0b0b0c;
  --fg: #f3f3f4;
  --mut: rgba(243, 243, 244, .66);
  --dim: rgba(243, 243, 244, .4);
  --glass-hi: rgba(36, 36, 40, .72);
  --line: rgba(255, 255, 255, .13);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
body { -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
/* Экран прокручивается: на маленьком телефоне с открытой клавиатурой поле не должно уходить за край. */
.ekran {
  min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  background: radial-gradient(120% 80% at 50% 0%, #19191c 0%, var(--bg) 70%);
}
.karta { width: 100%; max-width: 420px; }
[hidden] { display: none !important; }
.nadzag { margin: 0 0 14px; font-size: 13px; letter-spacing: .02em; color: var(--dim); line-height: 1.45; }
h1 { margin: 0 0 14px; font-size: 38px; line-height: 1.06; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: var(--mut); }
textarea, input {
  display: block; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--glass-hi); color: var(--fg); font-size: 17px; line-height: 1.45; outline: none; transition: border-color .2s;
}
textarea { min-height: 128px; margin: 20px 0 8px; resize: none; }
input { margin: 14px 0 0; }
textarea:focus, input:focus { border-color: rgba(255, 255, 255, .42); }
textarea::placeholder, input::placeholder { color: var(--dim); }
.info { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--dim); }
#schet { font-variant-numeric: tabular-nums; }
.knopka {
  display: block; width: 100%; margin: 22px 0 14px; padding: 17px 20px; border: 0; border-radius: 16px;
  background: var(--fg); color: #0b0b0c; font-size: 17px; font-weight: 650; cursor: pointer;
  box-shadow: 0 10px 30px rgba(255, 255, 255, .08);
}
.knopka:active { transform: scale(.985); }
.knopka.vtor { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.knopka:disabled { opacity: .4; cursor: default; }
.knopka:disabled:active { transform: none; }
.oshibka { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-hi); color: var(--fg); font-size: 15px; }
</style>
</head>
<body>
<main class="ekran">
  <div class="karta">
    <section id="forma">
      <p class="nadzag">День рождения</p>
      <h1>Поздравьте Дину</h1>
      <p>Поздравление появится на большом экране.</p>
      <textarea id="tekst" maxlength="200" rows="4" placeholder="Ваше поздравление" aria-label="Ваше поздравление"></textarea>
      <div class="info"><span>Появится на экране</span><span id="schet">0 / 200</span></div>
      <input id="podp" maxlength="40" placeholder="Подпись — можно не писать" aria-label="Подпись" autocomplete="off">
      <button id="otpravit" class="knopka" type="button" disabled>Отправить на экран</button>
      <p class="oshibka" id="oshibka" hidden>Не получилось отправить. Проверьте интернет и нажмите ещё раз.</p>
    </section>
    <section id="gotovo" hidden>
      <p class="nadzag">День рождения</p>
      <h1>Отправлено</h1>
      <p>Смотрите на экран.</p>
      <button id="esche" class="knopka vtor" type="button">Написать ещё</button>
    </section>
  </div>
</main>
<script>
/* Связь показа: телефоны зала → экран. Перенесена из доклада «Портрет»
   (projects/portret-prezentaciya, там проверена в сети колледжа 15 и 17.10.2026),
   из неё здесь нужна только тема поздравлений.

   Темы:
     <BASE>-p  поздравления Дине: телефоны → экран
               (JSON {v: 1, id, u: устройство, t, x: текст, n: подпись}; повторы — по id).
   Остальные темы движка (-s, -d, -c, пульт) здесь не используются.

   Надёжность важнее скорости: каждое сообщение уходит сразу во все каналы, а
   приёмник слушает все и сам отсеивает повторы — по id. Каналы независимы:
   три публичных MQTT-брокера без регистрации (EMQX, Mosquitto, HiveMQ) и
   ntfy.sh (250 сообщений в сутки на IP-адрес). Лёг один — доставят остальные. */
(function (global) {
  'use strict';

  const qs = new URLSearchParams(global.location.search);
  // ?baza=<имя> — свои темы и id экрана, чтобы проверка на настоящих сервисах
  // не задела презентацию пользователя. Не менять BASE без перевыпуска сайта.
  const BASE = qs.get('baza') || 'dina-b04b0a2e';
  const T = { state: BASE + '-s', wishes: BASE + '-p', chasy: BASE + '-c', diag: BASE + '-d' };
  // Пульт докладчика: команды телефон → презентация и вид для пульта
  // (номер кадра, речь, кнопки кадра) презентация → телефон, с удержанием.
  // Темы с ключом: он есть только в презентации на флешке и в ссылке пульта,
  // в этом файле его нет.
  const temaPulta = (klyuch) => BASE + '-u-' + klyuch;
  const temaPultaVid = (klyuch) => BASE + '-v-' + klyuch;
  // Что на экране финала (пожелания и рисунки) — пульту, чтобы удалять.
  const temaPultaSpisok = (klyuch) => BASE + '-l-' + klyuch;

  // ?ntfy=/ntfy — подменный ntfy (tools/server.py); ?mqtt=ws://127.0.0.1:<порт>/mqtt —
  // подменный брокер (tools/mqttserver.py), ?mqtt=net — без MQTT.
  // Без них — настоящие сервисы.
  const server = (qs.get('ntfy') || 'https://ntfy.sh').replace(/\/$/, '');
  const MQTT_BROKERY = [
    ['EMQX', 'wss://broker.emqx.io:8084/mqtt'],
    ['Mosquitto', 'wss://test.mosquitto.org:8081/mqtt'],
    ['HiveMQ', 'wss://broker.hivemq.com:8884/mqtt'],
  ];
  const MQTT = qs.has('mqtt')
    ? qs.get('mqtt').split(',').filter((u) => u && u !== 'net').map((u, i) => ['MQTT ' + (i + 1), u])
    : MQTT_BROKERY;

  function rid(n) {
    const a = new Uint8Array(n || 6);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  function deviceId() {
    try {
      let id = localStorage.getItem('dina-ustroystvo');
      if (!id) { id = rid(6); localStorage.setItem('dina-ustroystvo', id); }
      return id;
    } catch (e) {
      if (!global.__dinaId) global.__dinaId = rid(6);
      return global.__dinaId;
    }
  }

  // ---- ntfy.sh ----
  // Ответ 429 — дневной лимит сообщений исчерпан. Страницы узнают об этом
  // событием 'dina-limit'; дальше на этой странице в ntfy не пишем.
  let limit = false;
  let ntfySost = null; // null — подписки нет; 'connecting' | 'open' | 'wait'
  async function ntfyPublish(topic, text) {
    if (limit) { const e = new Error('ntfy: дневной лимит сообщений исчерпан'); e.limit = true; throw e; }
    let r;
    try {
      r = await fetch(server + '/' + topic, { method: 'POST', body: text });
    } catch (e) {
      sobytie('kanal', { imya: 'ntfy', sost: 'otpravka', kod: 'set' });
      throw e;
    }
    if (!r.ok) sobytie('kanal', { imya: 'ntfy', sost: 'otpravka', kod: r.status });
    if (r.status === 429) {
      if (!limit) { limit = true; global.dispatchEvent(new CustomEvent('dina-limit')); }
      const e = new Error('ntfy: дневной лимит сообщений исчерпан');
      e.limit = true;
      throw e;
    }
    if (!r.ok) throw new Error('ntfy ' + r.status);
  }

  // Подписка на несколько тем одним SSE-соединением. Сама переподключается с
  // паузой и продолжает с последнего полученного сообщения, повторы отсекает.
  // Телефон «просыпается»: вернулись на страницу, разблокировали экран, снова
  // появилась сеть. Соединения за это время могли тихо умереть (телефон в
  // кармане, сменилась сеть), а пауза между попытками — вырасти до 15 с. Каждый
  // канал проверяет себя сразу (пользователь 11.10.2026: пожелания с телефона,
  // пролежавшего в кармане, шли по 2–4 с).
  // Датчики для журнала (zhurnal.js): каналы, пинги, пробуждения. Пока журнал
  // не слушает (Svyaz.naSobytie не задан), ничего не делают.
  let naSobytie = null;
  function sobytie(tip, d) { if (naSobytie) { try { naSobytie(tip, d); } catch (e) { /* журнал не мешает связи */ } } }

  // zanovo — страница была свёрнута дольше 2 с (или вернулась из кэша, или
  // снова появилась сеть): соединения не проверять пингом, а сразу открыть
  // новые. iPhone рвёт сокеты свёрнутой вкладки, а страница этого не видит:
  // пинг ждал ответа до 5 с, и пульт после сворачивания оживал секунд через
  // 6 (пользователь 16.10.2026: «долго ждать, чтобы телефон снова
  // подключился»). Теперь — время одного подключения, ~0,3–1 с.
  const ozhiviteli = new Set();
  function ozhivit(zanovo, skryt) {
    sobytie('ozhivit', { zanovo: !!zanovo, skryt: skryt || 0 });
    ozhiviteli.forEach((f) => { try { f(!!zanovo); } catch (e) { /* остальные каналы — дальше */ } });
  }
  if (typeof document !== 'undefined') {
    let skrytS = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') { skrytS = Date.now(); return; }
      const skryt = skrytS > 0 ? Date.now() - skrytS : 0;
      ozhivit(skryt > 2000, skryt);
      skrytS = 0;
    });
    global.addEventListener('pageshow', (e) => { if (e.persisted) ozhivit(true); });
    global.addEventListener('online', () => ozhivit(true));
  }

  // Код ошибки ntfy для журнала: EventSource его не сообщает, поэтому —
  // короткий запрос тех же тем (poll, без ожидания) и его ответ. Не чаще раза
  // в 30 с и только в презентации (Svyaz.kodyOshibok = true; телефоны тоже
  // слушают события, но им проверка ни к чему): запросы к ntfy.sh тоже на
  // счету его лимита.
  let kodNtfyT = 0, kodyOshibok = false;
  function kodNtfy(topics, otkaz) {
    if (!kodyOshibok) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    if (Date.now() - kodNtfyT < 30000) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    kodNtfyT = Date.now();
    fetch(server + '/' + topics[0] + '/json?poll=1&since=' + Math.floor(Date.now() / 1000), { cache: 'no-store' })
      .then((r) => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: r.status }),
        () => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: 'set' }));
  }

  function ntfySubscribe(topics, since, onMsg, onStatus) {
    let es = null, lastId = null, closed = false, delay = 1000, timer = 0, zhivo = 0;
    const seen = new Set();
    const status = (s) => { ntfySost = s; if (onStatus) onStatus(s); };
    function open() {
      if (closed) return;
      const from = lastId || since;
      es = new EventSource(server + '/' + topics.join(',') + '/sse?since=' + encodeURIComponent(from));
      es.onopen = () => { delay = 1000; zhivo = Date.now(); status('open'); sobytie('kanal', { imya: 'ntfy', sost: 'open' }); };
      es.onmessage = (e) => {
        zhivo = Date.now();
        let m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.event && m.event !== 'message') return;
        if (m.id) {
          if (seen.has(m.id)) return;
          seen.add(m.id);
          lastId = m.id;
        }
        try { onMsg(m.topic, m.message || '', m.time || 0, 'ntfy'); } catch (err) { console.error(err); }
      };
      es.onerror = () => {
        // readyState 2 — браузер закрыл поток сам: сервер ответил не 200
        // (429 — лимит, 5xx); 0 — поток оборвался в сети.
        kodNtfy(topics, es.readyState === 2);
        es.close();
        status('wait');
        if (closed) return;
        clearTimeout(timer);
        timer = setTimeout(open, delay);
        delay = Math.min(delay * 2, 15000);
      };
    }
    // Проснулись: закрытое — открыть сейчас; давно молчавшее — открыть заново
    // (с lastId: что пришло за время сна, придёт, повторы отсекает seen).
    const proverka = (zanovo) => {
      if (closed) return;
      if (zanovo || !es || es.readyState === 2 || (es.readyState === 1 && Date.now() - zhivo > 30000)) {
        if (es) es.close();
        clearTimeout(timer);
        delay = 1000;
        open();
      }
    };
    ozhiviteli.add(proverka);
    status('connecting');
    open();
    return { close() { closed = true; ozhiviteli.delete(proverka); clearTimeout(timer); if (es) es.close(); } };
  }

  // ---- MQTT 3.1.1 поверх WebSocket ----
  // Свой маленький клиент вместо библиотеки: нужно немного — подключиться,
  // подписаться, отправить с удержанием (retain: новый подписчик сразу получает
  // последнее состояние, как since=latest у ntfy), держать связь и сам
  // переподключаться. Одно соединение на брокер на всю страницу.
  const enc = new TextEncoder(), dec = new TextDecoder();
  const dlina = (n) => { const b = []; do { let x = n % 128; n = Math.floor(n / 128); if (n) x |= 128; b.push(x); } while (n); return b; };
  const stroka = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const paket = (tip, telo) => new Uint8Array([tip, ...dlina(telo.length), ...telo]);
  // Пакет с двоичной нагрузкой (кадр камеры) — без разворачивания в массив.
  const paketDvoichno = (tip, zagolovok, dannye) => {
    const dl = dlina(zagolovok.length + dannye.length);
    const u8 = new Uint8Array(1 + dl.length + zagolovok.length + dannye.length);
    u8[0] = tip;
    u8.set(dl, 1);
    u8.set(zagolovok, 1 + dl.length);
    u8.set(dannye, 1 + dl.length + zagolovok.length);
    return u8;
  };

  function mqttKlient(imya, url) {
    const slushateli = new Set(), sledyashchie = new Set(), temy = new Set();
    const dvoichnye = new Set(), dvoichnyeTemy = new Set(); // кадры камеры
    const zhdutUderzh = new Map(), zhdutProchie = [];
    let ws = null, otkryt = false, pauza = 1000, timer = 0, ping = 0, priem = 0, nomer = 0, podklT = 0, pingT = 0;
    let bufer = new Uint8Array(0);
    const k = { imya, mqtt: true, sost: 'connecting' };

    const smenit = (s) => { if (k.sost !== s) { k.sost = s; sledyashchie.forEach((f) => f(s)); } };
    const otpravit = (u8) => { try { if (ws && ws.readyState === 1) { ws.send(u8); return true; } } catch (e) { /* ниже — в очередь */ } return false; };
    function podpiska(tema) {
      nomer = (nomer % 65535) + 1;
      return paket(0x82, [nomer >> 8, nomer & 255, ...stroka(tema), 0]);
    }
    function pozzhe() {
      clearTimeout(timer);
      timer = setTimeout(podklyuchit, pauza);
      pauza = Math.min(pauza * 2, 15000);
    }
    function podklyuchit() {
      if (ws) return;
      let tek;
      try { tek = new WebSocket(url, ['mqtt']); } catch (e) { sobytie('kanal', { imya, sost: 'oshibka' }); smenit('wait'); pozzhe(); return; }
      ws = tek;
      podklT = Date.now();
      tek.binaryType = 'arraybuffer';
      tek.onopen = () => {
        bufer = new Uint8Array(0);
        otpravit(paket(0x10, [...stroka('MQTT'), 4, 2, 0, 60, ...stroka('pt' + rid(6))]));
      };
      tek.onmessage = (e) => { if (ws === tek && e.data instanceof ArrayBuffer) prinyat(new Uint8Array(e.data)); };
      tek.onclose = (e) => {
        if (ws !== tek) return;
        sobytie('kanal', { imya, sost: 'zakryt', kod: e && e.code, prichina: e && e.reason ? String(e.reason).slice(0, 80) : '', bylOtkryt: otkryt, ms: Date.now() - podklT });
        ws = null; otkryt = false; clearInterval(ping);
        smenit('wait');
        pozzhe();
      };
      tek.onerror = () => { /* следом придёт onclose */ };
    }
    function zakrytTekushchee() { try { if (ws) ws.close(); } catch (e) { /* уже закрыто */ } }
    // Соединение умерло — закрыть и подключиться почти сразу, а не через паузу.
    function pereklyuchit() { sobytie('kanal', { imya, sost: 'molchit' }); pauza = 250; zakrytTekushchee(); }
    // Проснулись: нет соединения — подключиться сейчас (пауза могла вырасти до
    // 15 с); есть — пинг, и если за 5 с брокер ничего не прислал, оно мёртвое.
    function proverit(zanovo) {
      if (!temy.size && !zhdutUderzh.size && !zhdutProchie.length) return; // канал ещё не нужен
      if (zanovo && ws) {
        // Старый сокет бросаем, не дожидаясь его закрытия: у «тихо умершего»
        // onclose может прийти не скоро, а его обработчик чужой сокет и так
        // пропускает (ws !== tek).
        sobytie('kanal', { imya, sost: 'zanovo' });
        zakrytTekushchee();
        ws = null; otkryt = false; clearInterval(ping);
      }
      if (!ws) { clearTimeout(timer); pauza = 1000; podklyuchit(); return; }
      if (!otkryt) return; // подключается
      const pered = priem, tek = ws;
      pingT = Date.now();
      otpravit(new Uint8Array([0xc0, 0]));
      setTimeout(() => { if (ws === tek && priem === pered) pereklyuchit(); }, 5000);
    }
    ozhiviteli.add(proverit);
    function prinyat(kusok) {
      priem = Date.now();
      const b = new Uint8Array(bufer.length + kusok.length);
      b.set(bufer);
      b.set(kusok, bufer.length);
      bufer = b;
      for (;;) {
        if (bufer.length < 2) return;
        let dl = 0, mn = 1, i = 1, bayt;
        do {
          if (i >= bufer.length) return; // длина пакета ещё не дошла
          bayt = bufer[i++];
          dl += (bayt & 127) * mn;
          mn *= 128;
        } while ((bayt & 128) && i < 5);
        if (bufer.length < i + dl) return;
        const tip = bufer[0] >> 4, flagi = bufer[0] & 15, telo = bufer.subarray(i, i + dl);
        bufer = bufer.slice(i + dl);
        if (tip === 2) { // CONNACK
          if (telo[1] !== 0) { sobytie('kanal', { imya, sost: 'otkaz', kod: telo[1] }); zakrytTekushchee(); return; }
          otkryt = true;
          pauza = 1000;
          sobytie('kanal', { imya, sost: 'open', ms: Date.now() - podklT });
          temy.forEach((t) => otpravit(podpiska(t)));
          zhdutUderzh.forEach((u8) => otpravit(u8));
          zhdutUderzh.clear();
          zhdutProchie.splice(0).forEach((u8) => otpravit(u8));
          clearInterval(ping);
          // Пинг раз в 10 с; 25 с тишины — два пинга без ответа: соединение
          // умерло (сменилась сеть, телефон спал) — переподключиться сразу.
          // Было 25 и 70 с: телефон по минуте показывал старое (11.10.2026).
          ping = setInterval(() => {
            if (Date.now() - priem > 25000) { pereklyuchit(); return; }
            pingT = Date.now();
            otpravit(new Uint8Array([0xc0, 0]));
          }, 10000);
          smenit('open');
        } else if (tip === 13) { // PINGRESP
          if (pingT) { sobytie('ping', { imya, ms: Date.now() - pingT }); pingT = 0; }
        } else if (tip === 3) { // PUBLISH
          const tl = (telo[0] << 8) | telo[1];
          const tema = dec.decode(telo.subarray(2, 2 + tl));
          let s = 2 + tl;
          if ((flagi >> 1) & 3) s += 2; // QoS > 0: номер пакета
          if (dvoichnyeTemy.has(tema)) { // кадр камеры — как есть, не текст
            const u8 = telo.slice(s);
            dvoichnye.forEach((f) => { try { f(tema, u8); } catch (e) { console.error(e); } });
            continue;
          }
          const tekst = dec.decode(telo.subarray(s));
          slushateli.forEach((f) => { try { f(tema, tekst); } catch (e) { console.error(e); } });
        }
      }
    }
    return {
      k,
      slushat(f) { slushateli.add(f); return () => slushateli.delete(f); },
      sledit(f) { sledyashchie.add(f); f(k.sost); return () => sledyashchie.delete(f); },
      podpisat(tema) {
        if (temy.has(tema)) return;
        temy.add(tema);
        if (otkryt) otpravit(podpiska(tema));
        podklyuchit();
      },
      // Кадры камеры — двоичные и без очереди: не ушёл сейчас — пропущен
      // (живому видео старый кадр не нужен). zanyat — сокет ещё отправляет
      // прошлый: следующий кадр не снимать, иначе очередь растёт. Было 128 КБ —
      // за ними на медленном мобильном интернете копилась секунда-другая
      // «пинга» (пользователь, 08.10.2026); теперь — почти пустой буфер.
      slushatDvoichno(f) { dvoichnye.add(f); return () => dvoichnye.delete(f); },
      podpisatDvoichno(tema) { dvoichnyeTemy.add(tema); this.podpisat(tema); },
      get zanyat() { return !ws || ws.bufferedAmount > 16 * 1024; },
      publikovatDvoichno(tema, u8) {
        podklyuchit();
        if (!otkryt || this.zanyat) return false;
        return otpravit(paketDvoichno(0x30, stroka(tema), u8));
      },
      // true — ушло сразу; иначе ждёт подключения (состояние — только последнее).
      publikovat(tema, tekst, uderzhat) {
        const u8 = paket(0x30 | (uderzhat ? 1 : 0), [...stroka(tema), ...enc.encode(tekst)]);
        podklyuchit();
        if (otkryt && otpravit(u8)) return true;
        if (uderzhat) zhdutUderzh.set(tema, u8);
        else { zhdutProchie.push(u8); if (zhdutProchie.length > 20) zhdutProchie.shift(); }
        return false;
      },
    };
  }
  const mqttKlienty = [];
  function mqttVse() {
    if (!mqttKlienty.length) MQTT.forEach(([imya, url]) => mqttKlienty.push(mqttKlient(imya, url)));
    return mqttKlienty;
  }

  // ---- все каналы вместе ----
  // Отправить во все каналы. Успех — если сообщение ушло хотя бы в один.
  // Состояние доклада — с удержанием: телефон, открывший страницу позже,
  // сразу получает текущую сцену.
  // opts.uderzhat — с удержанием и для другой темы (вид пульта докладчика).
  function publish(topic, text, opts) {
    const uderzhat = topic === T.state || !!(opts && opts.uderzhat);
    let ushlo = false;
    mqttVse().forEach((m) => { if (m.publikovat(topic, text, uderzhat)) ushlo = true; });
    return ntfyPublish(topic, text).then(() => true, (e) => {
      if (ushlo) return true;
      throw e;
    });
  }

  // Подписка сразу на все каналы. onMsg(topic, text, timeSec) зовётся по разу
  // от каждого канала — повторы отсеивает приёмник (по t в сообщении).
  // onStatus('open' — хоть один канал на связи | 'wait' — ни одного, все
  // пробовали). Пока каналы только подключаются, статуса нет.
  function subscribe(topics, since, onMsg, onStatus) {
    const sost = new Map();
    const obnovit = () => {
      const vse = [...sost.values()];
      const s = vse.includes('open') ? 'open' : vse.length && !vse.includes('connecting') ? 'wait' : null;
      if (s && onStatus) onStatus(s);
    };
    const otpiski = [];
    const ntfy = ntfySubscribe(topics, since, onMsg, (s) => { sost.set('ntfy', s); obnovit(); });
    mqttVse().forEach((m) => {
      otpiski.push(m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, Date.now() / 1000, m.k.imya); }));
      otpiski.push(m.sledit((s) => { sost.set(m.k.imya, s); obnovit(); }));
      topics.forEach((t) => m.podpisat(t));
    });
    return { close() { ntfy.close(); otpiski.forEach((f) => f()); } };
  }

  // ---- только через MQTT-брокеры, мимо ntfy и его дневного лимита ----
  // Штрихи часов, пока человек рисует: по сообщению раз в ~0,4 с с каждого
  // телефона зала — ntfy такого не выдержит (250 в сутки на IP).
  function publishMqtt(topic, text, uderzhat) { mqttVse().forEach((m) => m.publikovat(topic, text, !!uderzhat)); }
  function subscribeMqtt(topics, onMsg) {
    const otpiski = mqttVse().map((m) => {
      const f = m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, m.k.imya); });
      topics.forEach((tm) => m.podpisat(tm));
      return f;
    });
    return { close() { otpiski.forEach((f) => f()); } };
  }

  // Каналы и их состояние — для подписей на экране докладчика.
  function kanaly() {
    const ks = mqttKlienty.map((m) => ({ imya: m.k.imya, mqtt: true, sost: m.k.sost }));
    if (ntfySost) ks.push({ imya: 'ntfy', mqtt: false, sost: limit ? 'limit' : ntfySost });
    return ks;
  }
  // Дойдёт ли команда до телефонов: 'da' | 'limit' | 'zhdu' | 'net'. Подписка
  // ntfy жива и при исчерпанном лимите — но отправить в него уже нельзя.
  function dostavka() {
    const ks = kanaly();
    if (ks.some((k) => k.mqtt && k.sost === 'open')) return 'da';
    if (limit) return 'limit';
    if (ks.some((k) => k.sost === 'open')) return 'da';
    if (ks.some((k) => k.sost === 'connecting')) return 'zhdu';
    return 'net';
  }


  global.Svyaz = {
    BASE, T, server, deviceId, publish, subscribe, kanaly, dostavka, temaPulta, temaPultaVid, temaPultaSpisok, ozhivit,
    publishMqtt, subscribeMqtt,
    set naSobytie(f) { naSobytie = f; },
    set kodyOshibok(v) { kodyOshibok = !!v; },
    get limit() { return limit; },
  };
})(window);
</script>
<script>
/* Страница телефона: поздравление Дине → экран показа (тема Svyaz.T.wishes).
   Сообщение {v: 1, id, u, t, x: текст, n: подпись} уходит во все каналы сразу;
   повтор после ошибки — с тем же id, чтобы на экране не вышло двух одинаковых. */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const tekst = $('#tekst'), podp = $('#podp'), knopka = $('#otpravit'), schet = $('#schet');
  const forma = $('#forma'), gotovo = $('#gotovo'), oshibka = $('#oshibka');
  const MAX = 200, MAX_PODP = 40;
  const TEKST_KNOPKI = knopka.textContent;

  // Каналы открываются сразу — первое поздравление уйдёт без ожидания подключения.
  Svyaz.subscribeMqtt([Svyaz.T.wishes], () => {});

  function rid() {
    const a = new Uint8Array(8);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  let zanyato = false;
  let zhdet = null; // не ушедшее сообщение: повтор — с тем же id
  function obnovit() {
    schet.textContent = tekst.value.length + ' / ' + MAX;
    knopka.disabled = zanyato || !tekst.value.trim();
  }
  tekst.addEventListener('input', () => { zhdet = null; obnovit(); });
  podp.addEventListener('input', () => { zhdet = null; });
  try { podp.value = localStorage.getItem('dina-podpis') || ''; } catch (e) { /* без хранилища */ }

  knopka.addEventListener('click', async () => {
    const x = tekst.value.trim().slice(0, MAX);
    if (!x || zanyato) return;
    const n = podp.value.trim().slice(0, MAX_PODP);
    try { localStorage.setItem('dina-podpis', n); } catch (e) { /* без хранилища */ }
    if (!zhdet) zhdet = JSON.stringify({ v: 1, id: rid(), u: Svyaz.deviceId(), t: Date.now() / 1000, x, n });
    zanyato = true;
    oshibka.hidden = true;
    knopka.textContent = 'Отправляю…';
    obnovit();
    try {
      await Svyaz.publish(Svyaz.T.wishes, zhdet);
      zhdet = null;
      tekst.value = '';
      forma.hidden = true;
      gotovo.hidden = false;
    } catch (e) {
      oshibka.hidden = false;
    }
    zanyato = false;
    knopka.textContent = TEKST_KNOPKI;
    obnovit();
  });

  $('#esche').addEventListener('click', () => {
    gotovo.hidden = true;
    forma.hidden = false;
    obnovit();
    tekst.focus();
  });
  obnovit();
})();
</script>
