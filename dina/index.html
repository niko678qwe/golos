<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<title>Поздравьте Дину</title>
<style>
:root {
  --bg: #0b0b0c;
  --fg: #f3f3f4;
  --mut: rgba(243, 243, 244, .66);
  --dim: rgba(243, 243, 244, .4);
  --glass-hi: rgba(36, 36, 40, .72);
  --line: rgba(255, 255, 255, .13);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
body { -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
/* Экран прокручивается: на маленьком телефоне с открытой клавиатурой поле не должно уходить за край. */
.ekran {
  min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  background: radial-gradient(120% 80% at 50% 0%, #19191c 0%, var(--bg) 70%);
}
.karta { width: 100%; max-width: 420px; }
[hidden] { display: none !important; }
.nadzag { margin: 0 0 14px; font-size: 13px; letter-spacing: .02em; color: var(--dim); line-height: 1.45; }
h1 { margin: 0 0 14px; font-size: 38px; line-height: 1.06; font-weight: 700; letter-spacing: -.02em; }
p { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: var(--mut); }
textarea, input {
  display: block; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--glass-hi); color: var(--fg); font-size: 17px; line-height: 1.45; outline: none; transition: border-color .2s;
}
textarea { min-height: 128px; margin: 20px 0 8px; resize: none; }
input { margin: 14px 0 0; }
textarea:focus, input:focus { border-color: rgba(255, 255, 255, .42); }
textarea::placeholder, input::placeholder { color: var(--dim); }
.info { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--dim); }
#schet { font-variant-numeric: tabular-nums; }
.knopka {
  display: block; width: 100%; margin: 22px 0 14px; padding: 17px 20px; border: 0; border-radius: 16px;
  background: var(--fg); color: #0b0b0c; font-size: 17px; font-weight: 650; cursor: pointer;
  box-shadow: 0 10px 30px rgba(255, 255, 255, .08);
}
.knopka:active { transform: scale(.985); }
.knopka.vtor { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.knopka:disabled { opacity: .4; cursor: default; }
.knopka:disabled:active { transform: none; }
.vybor { display: flex; gap: 6px; margin: 18px 0 0; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-hi); }
.vybor button { flex: 1; padding: 10px; border: 0; border-radius: 10px; background: transparent; color: var(--mut); font-size: 15px; font-weight: 600; cursor: pointer; }
.vybor button.on { background: var(--fg); color: #0b0b0c; }
#holst { display: block; width: 100%; aspect-ratio: 1; margin: 16px 0 10px; border-radius: 16px; background: #141416; border: 1px solid var(--line); touch-action: none; }
.r-ryad { display: flex; gap: 10px; margin-bottom: 8px; }
.r-ryad .knopka { margin: 0; padding: 13px 10px; font-size: 15px; }
.itog { min-height: 1.5em; font-size: 15px; color: var(--mut); }
/* Вкладки: «Поздравить» и «Все поздравления» (читать с телефона — экран проектора мелкий). */
.vkladki { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; margin: 0 0 22px; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: rgba(20, 20, 22, .92); }
.vkladki button { flex: 1; padding: 10px 6px; border: 0; border-radius: 10px; background: transparent; color: var(--mut); font-size: 15px; font-weight: 600; cursor: pointer; }
.vkladki button.on { background: var(--fg); color: #0b0b0c; }
.podpis { margin: 18px 0 8px; font-size: 13px; color: var(--dim); }
/* Обложка карточки и цвета рисунка — кружки на выбор. */
.oblozhki, .palitra { display: flex; flex-wrap: wrap; gap: 10px; }
.oblozhki button { flex: 1; min-width: 70px; padding: 10px 4px; border-radius: 12px; border: 1.5px solid var(--ramka); background: var(--fon); color: var(--tekst); font-size: 13px; font-weight: 600; cursor: pointer; }
.oblozhki button.on { outline: 2px solid var(--fg); outline-offset: 2px; }
.palitra button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); background: var(--c); cursor: pointer; }
.palitra button.on { outline: 2px solid var(--fg); outline-offset: 3px; }
.o-grafit { --fon: #141416; --tekst: #f3f3f4; --ramka: rgba(255, 255, 255, .42); }
.o-bumaga { --fon: #f6f4ef; --tekst: #1b1b1d; --ramka: rgba(0, 0, 0, .14); }
.o-golograma { --fon: #08171d; --tekst: #e3fbff; --ramka: rgba(90, 220, 255, .95); }
.o-zoloto { --fon: #15120b; --tekst: #f7e9c6; --ramka: #c9a24a; }
/* Все поздравления — карточки столбиком, как на экране. */
.spisok { display: grid; gap: 12px; margin-bottom: 18px; }
.pk { padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--ramka); background: var(--fon); color: var(--tekst); font-size: 17px; line-height: 1.45; overflow-wrap: anywhere; }
.pk.ris { padding: 8px; max-width: 280px; }
.pk .risunok, .spisok-pusto svg { display: block; width: 100%; height: auto; }
.pk .risunok path { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
.o-golograma.pk { box-shadow: 0 0 16px rgba(90, 220, 255, .35); }
</style>
</head>
<body>
<main class="ekran">
  <div class="karta">
    <div class="vkladki" role="tablist" aria-label="Раздел">
      <button type="button" class="on" data-vkladka="forma" role="tab" aria-selected="true">Поздравить</button>
      <button type="button" data-vkladka="vse" role="tab" aria-selected="false">Все поздравления <span id="kolvo"></span></button>
    </div>
    <section id="forma">
      <p class="nadzag">День рождения</p>
      <h1>Поздравьте Дину</h1>
      <p>Напишите поздравление или нарисуйте — оно появится на большом экране.</p>
      <div class="vybor" role="tablist" aria-label="Что отправить">
        <button type="button" class="on" data-rezhim="tekst" role="tab" aria-selected="true">Написать</button>
        <button type="button" data-rezhim="ris" role="tab" aria-selected="false">Нарисовать</button>
      </div>
      <div id="blok-tekst">
        <textarea id="tekst" maxlength="200" rows="4" placeholder="Ваше поздравление" aria-label="Ваше поздравление"></textarea>
        <div class="info"><span>Анонимно · появится на экране</span><span id="schet">0 / 200</span></div>
      </div>
      <div id="blok-ris" hidden>
        <canvas id="holst" aria-label="Поле для рисунка"></canvas>
        <div class="palitra" id="palitra" aria-label="Цвет линии"></div>
        <div class="r-ryad" style="margin-top: 12px">
          <button id="b-otmena" class="knopka vtor" type="button">Отменить линию</button>
          <button id="b-steret" class="knopka vtor" type="button">Стереть</button>
        </div>
        <div class="info"><span>Анонимно · появится на экране</span></div>
      </div>
      <p class="podpis">Обложка карточки</p>
      <div class="oblozhki" id="oblozhki"></div>
      <button id="otpravit" class="knopka" type="button" disabled>Отправить на экран</button>
      <p class="itog" id="itog" aria-live="polite"></p>
    </section>
    <section id="vse" hidden>
      <p class="nadzag">День рождения</p>
      <h1>Все поздравления</h1>
      <p id="spisok-pusto">Пока пусто — поздравления появятся здесь вместе с экраном.</p>
      <div class="spisok" id="spisok"></div>
      <button id="sohranit" class="knopka" type="button" disabled>Сохранить себе</button>
      <p class="itog" id="itog-sohr" aria-live="polite"></p>
    </section>
  </div>
</main>
<script>
/* Тест рисования часов: общее для телефона и презентации.

   Рисунок — штрихи: массивы точек [x, y] в долях квадрата (0…1). По сети
   уходит строкой: каждая координата — два знака из 64 (0…4095), штрихи
   через точку. Часы с цифрами — 300–600 точек, 1,2–2,5 КБ: влезает и в
   ntfy (до 4 КБ). Чужой ввод разбирается строго: незнакомый знак, лишние
   штрихи или точки — рисунок не принимается.

   Примеры для шкалы (норма, ошибки в стрелках, цифры в обратном порядке,
   распад) рисуются кодом «от руки»: цифры — штрихами, с небольшой дрожью
   руки, одинаково при каждом открытии. */
(function (global) {
  'use strict';

  const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  const NOMER = new Map(Array.from(ABC, (c, i) => [c, i]));
  const MAKS_SHTRIHOV = 300, MAKS_TOCHEK = 1500, MAKS_DLINA = 3 * MAKS_TOCHEK + MAKS_SHTRIHOV;

  function kodirovat(shtrihi) {
    return shtrihi.filter((s) => s.length).map((s) => s.map(([x, y]) => {
      const a = Math.round(Math.max(0, Math.min(1, x)) * 4095), b = Math.round(Math.max(0, Math.min(1, y)) * 4095);
      return ABC[a >> 6] + ABC[a & 63] + ABC[b >> 6] + ABC[b & 63];
    }).join('')).join('.');
  }

  function raskodirovat(s) {
    if (typeof s !== 'string' || s.length > MAKS_DLINA) return null;
    if (!s) return [];
    const kuski = s.split('.');
    if (kuski.length > MAKS_SHTRIHOV) return null;
    let vsego = 0;
    const out = [];
    for (const k of kuski) {
      if (!k.length || k.length % 4) return null;
      const shtrih = [];
      for (let i = 0; i < k.length; i += 4) {
        const c = [0, 1, 2, 3].map((j) => NOMER.get(k[i + j]));
        if (c.some((v) => v === undefined)) return null;
        shtrih.push([((c[0] << 6) | c[1]) / 4095, ((c[2] << 6) | c[3]) / 4095]);
      }
      vsego += shtrih.length;
      if (vsego > MAKS_TOCHEK) return null;
      out.push(shtrih);
    }
    return out;
  }

  // Путь SVG в квадрате 0…1000: ломаная сглажена через середины отрезков, как
  // линия от руки. Одна точка — короткая чёрточка: с круглым концом это точка.
  function put(shtrihi) {
    const r = (v) => Math.round(v * 1000);
    return shtrihi.map((s) => {
      if (!s.length) return '';
      const [x0, y0] = s[0];
      if (s.length === 1) return 'M' + r(x0) + ' ' + r(y0) + 'h1';
      if (s.length === 2) return 'M' + r(x0) + ' ' + r(y0) + 'L' + r(s[1][0]) + ' ' + r(s[1][1]);
      let d = 'M' + r(x0) + ' ' + r(y0);
      for (let i = 1; i < s.length - 1; i++) {
        const [x, y] = s[i], [xn, yn] = s[i + 1];
        d += 'Q' + r(x) + ' ' + r(y) + ' ' + r((x + xn) / 2) + ' ' + r((y + yn) / 2);
      }
      const [xe, ye] = s[s.length - 1];
      return d + 'L' + r(xe) + ' ' + r(ye);
    }).join('');
  }

  // Рисунок для вставки: <svg> с одним путём (класс задаёт толщину и цвет).
  const SVG = 'http://www.w3.org/2000/svg';
  function svg(shtrihi, klass) {
    const el = document.createElementNS(SVG, 'svg');
    el.setAttribute('viewBox', '0 0 1000 1000');
    if (klass) el.setAttribute('class', klass);
    el.setAttribute('aria-hidden', 'true');
    const p = document.createElementNS(SVG, 'path');
    p.setAttribute('d', put(shtrihi));
    el.appendChild(p);
    return el;
  }

  // ---- примеры «от руки» ----
  // Цифры — ломаные в рамке шириной 0,6 и высотой 1 (сверху вниз).
  const CIFRY = {
    0: [[[0.3, 0], [0.07, 0.14], [0, 0.5], [0.07, 0.86], [0.3, 1], [0.53, 0.86], [0.6, 0.5], [0.53, 0.14], [0.3, 0]]],
    1: [[[0.12, 0.22], [0.42, 0], [0.42, 1]]],
    2: [[[0.04, 0.24], [0.18, 0.05], [0.4, 0], [0.58, 0.14], [0.58, 0.34], [0.02, 1], [0.62, 0.98]]],
    3: [[[0.04, 0.1], [0.3, 0], [0.55, 0.1], [0.56, 0.32], [0.28, 0.47], [0.56, 0.6], [0.6, 0.84], [0.34, 1], [0.03, 0.9]]],
    4: [[[0.46, 1], [0.46, 0], [0, 0.68], [0.64, 0.68]]],
    5: [[[0.58, 0], [0.1, 0], [0.05, 0.44], [0.34, 0.38], [0.6, 0.54], [0.6, 0.84], [0.34, 1], [0.03, 0.9]]],
    6: [[[0.55, 0.04], [0.3, 0], [0.08, 0.24], [0, 0.6], [0.1, 0.92], [0.34, 1], [0.58, 0.86], [0.58, 0.62], [0.38, 0.48], [0.14, 0.52], [0.02, 0.66]]],
    7: [[[0, 0], [0.6, 0], [0.2, 1]]],
    8: [[[0.3, 0.47], [0.55, 0.34], [0.55, 0.12], [0.3, 0], [0.05, 0.12], [0.05, 0.34], [0.3, 0.47], [0.6, 0.64], [0.6, 0.88], [0.3, 1], [0, 0.88], [0, 0.64], [0.3, 0.47]]],
    9: [[[0.6, 0.4], [0.38, 0.52], [0.12, 0.46], [0.02, 0.24], [0.16, 0.03], [0.4, 0], [0.6, 0.16], [0.6, 0.5], [0.5, 0.84], [0.24, 1], [0.04, 0.92]]],
  };

  // Псевдослучайные числа с зерном: пример одинаков при каждом открытии.
  function zerno(n) {
    let s = n >>> 0;
    return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function primer(tip) {
    const sl = zerno({ norma: 7, vp: 11, obratno: 23, raspad: 41 }[tip] || 1);
    const drozh = tip === 'raspad' ? 0.009 : tip === 'obratno' ? 0.006 : 0.004;
    const d = () => (sl() - 0.5) * 2 * drozh;
    const S = [];
    const C = 0.5;
    // Циферблат: чуть неровный круг, конец заходит на начало (у распада — дуга).
    const krug = [];
    const nachalo = -Math.PI / 2 - 0.3 + sl() * 0.2;
    const dolya = tip === 'raspad' ? 0.82 : 1.03;
    for (let i = 0; i <= 64; i++) {
      const a = nachalo + (i / 64) * Math.PI * 2 * dolya;
      const r = 0.42 + Math.sin(a * 2 + 1.3) * 0.008 + d() * 0.6;
      krug.push([C + Math.cos(a) * r, C + Math.sin(a) * r * 0.97]);
    }
    S.push(krug);
    // Цифра n (одна или две) с центром в (x, y), высотой h.
    function chislo(n, x, y, h, naklon) {
      const zn = String(n), w = h * 0.6, prob = h * 0.18;
      const shir = zn.length * w + (zn.length - 1) * prob;
      Array.from(zn).forEach((c, i) => {
        const x0 = x - shir / 2 + i * (w + prob), y0 = y - h / 2;
        const cs = Math.cos(naklon), sn = Math.sin(naklon);
        CIFRY[c].forEach((sh) => S.push(sh.map(([gx, gy]) => {
          const px = x0 + gx * h + d() * 0.5 - x, py = y0 + gy * h + d() * 0.5 - y;
          return [x + px * cs - py * sn, y + px * sn + py * cs];
        })));
      });
    }
    const h = 0.068;
    if (tip === 'raspad') {
      // Цифры и циферблат не связаны: часть цифр — где попало, часть пропущена.
      [1, 2, 3, 5, 7, 8, 11].forEach((n) => {
        const x = 0.14 + sl() * 0.72, y = 0.12 + sl() * 0.76;
        chislo(n, x, y, h * (0.8 + sl() * 0.5), (sl() - 0.5) * 0.6);
      });
      S.push([[0.47 + d(), 0.55 + d()], [0.66 + d(), 0.71 + d()]]);
      return S;
    }
    for (let n = 1; n <= 12; n++) {
      const k = tip === 'obratno' ? -n : n;
      const a = (k / 12) * Math.PI * 2 - Math.PI / 2;
      const r = 0.335 + d();
      chislo(n, C + Math.cos(a) * r, C + Math.sin(a) * r, h, d() * 4);
    }
    // Стрелки «без пятнадцати два» (1:45): у нормы часовая короче и стоит
    // между 1 и 2, минутная — на 9; у «ошибок в стрелках» они одной длины и
    // часовая ровно на 2; у обратного порядка стрелки идут к нарисованным
    // 2 и 9 — то есть в другую сторону.
    const strelka = (ugolChas, dlina) => {
      const a = (ugolChas / 12) * Math.PI * 2 - Math.PI / 2;
      const kx = C + Math.cos(a) * dlina + d(), ky = C + Math.sin(a) * dlina + d();
      S.push([[C + d() * 0.4, C + d() * 0.4], [kx, ky]]);
      const b = 0.032;
      S.push([[kx - Math.cos(a - 0.45) * b, ky - Math.sin(a - 0.45) * b], [kx, ky], [kx - Math.cos(a + 0.45) * b, ky - Math.sin(a + 0.45) * b]]);
    };
    if (tip === 'norma') { strelka(1.75, 0.17); strelka(9, 0.27); }
    else if (tip === 'vp') { strelka(2, 0.24); strelka(9, 0.24); }
    else if (tip === 'obratno') { strelka(-2, 0.18); strelka(-9, 0.26); }
    return S;
  }

  global.Chasy = { kodirovat, raskodirovat, put, svg, primer, MAKS_TOCHEK };
})(window);
</script>
<script>
/* Общее для экрана показа и телефона: обложки карточек поздравлений, цвета рисунка,
   рисунок в SVG и на холсте (снимок экрана на память — P; «Сохранить себе» на телефоне).

   Обложку выбирает тот, кто поздравляет (поле o), цвет — у каждой линии рисунка (поле c:
   по цифре палитры на линию, в порядке линий r). Чужой ввод — строго: незнакомая
   обложка — «Графит», неверные цвета — рисунок белым. */
(function (global) {
  'use strict';

  // fon — фон карточки, tekst — цвет текста, ramka — обводка, svet — светлая (белые
  // линии рисунка на ней — тёмные), ten — тень.
  const OBLOZHKI = {
    grafit: { nazv: 'Графит', fon: '#141416', tekst: '#f3f3f4', ramka: 'rgba(255,255,255,.42)', svet: false },
    bumaga: { nazv: 'Бумага', fon: '#f6f4ef', tekst: '#1b1b1d', ramka: 'rgba(0,0,0,.14)', svet: true },
    golograma: { nazv: 'Голограмма', fon: '#08171d', tekst: '#e3fbff', ramka: 'rgba(90,220,255,.95)', svet: false, svechenie: 'rgba(90,220,255,.45)' },
    zoloto: { nazv: 'Золото', fon: '#15120b', tekst: '#f7e9c6', ramka: '#c9a24a', svet: false },
  };
  const CVETA = ['#f3f3f4', '#ff5a5f', '#ff9ac1', '#ffd34d', '#5ee37b', '#5ac8ff', '#b18cff'];

  const oblozhka = (o) => (Object.prototype.hasOwnProperty.call(OBLOZHKI, o) ? o : 'grafit');

  // Цвета линий: строка цифр палитры по числу линий; иначе — null (всё белым).
  function cveta(c, nLinij) {
    if (typeof c !== 'string' || c.length !== nLinij || !/^[0-6]*$/.test(c)) return null;
    return c;
  }
  // Цвет линии на обложке: белая на светлой — почти чёрная, иначе не видно.
  function cvetLinii(i, c, svet) {
    const v = CVETA[c ? Number(c[i]) : 0];
    return svet && v === CVETA[0] ? '#1b1b1d' : v;
  }

  // Рисунок в SVG: по пути на каждый цвет (линии одного цвета — одним путём).
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(shtrihi, c, svet, klass) {
    const el = document.createElementNS(SVGNS, 'svg');
    el.setAttribute('viewBox', '0 0 1000 1000');
    el.setAttribute('aria-hidden', 'true');
    if (klass) el.setAttribute('class', klass);
    const poCvetu = new Map();
    shtrihi.forEach((s, i) => {
      const k = cvetLinii(i, c, svet);
      if (!poCvetu.has(k)) poCvetu.set(k, []);
      poCvetu.get(k).push(s);
    });
    poCvetu.forEach((linii, k) => {
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', Chasy.put(linii));
      p.setAttribute('stroke', k);
      el.appendChild(p);
    });
    return el;
  }

  // Рисунок на холсте в квадрате (x, y, razm); толщина — как у SVG на экране.
  function risovat(ctx, shtrihi, c, svet, x, y, razm, tolshina) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(razm / 1000, razm / 1000);
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.lineWidth = tolshina || 14;
    shtrihi.forEach((s, i) => {
      ctx.strokeStyle = cvetLinii(i, c, svet);
      ctx.stroke(new Path2D(Chasy.put([s])));
    });
    ctx.restore();
  }

  // Текст по строкам в ширину w (для холста). Возвращает строки.
  function stroki(ctx, tekst, w) {
    const out = [];
    for (const abzac of String(tekst).split('\n')) {
      let tek = '';
      for (const slovo of abzac.split(/\s+/)) {
        if (!slovo) continue;
        const proba = tek ? tek + ' ' + slovo : slovo;
        if (ctx.measureText(proba).width <= w || !tek) tek = proba;
        else { out.push(tek); tek = slovo; }
        // слово длиннее строки — режем по буквам
        while (ctx.measureText(tek).width > w && tek.length > 1) {
          let n = tek.length - 1;
          while (n > 1 && ctx.measureText(tek.slice(0, n)).width > w) n--;
          out.push(tek.slice(0, n));
          tek = tek.slice(n);
        }
      }
      out.push(tek);
    }
    return out;
  }

  function skruglenie(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  // Карточка на холсте: левый верхний угол (x, y), ширина w, единица u (размеры — как
  // в CSS экрана). Возвращает высоту. Без рисования (izmerit) — только высота.
  function karta(ctx, w, u, x, y, opts, izmerit) {
    const ob = OBLOZHKI[oblozhka(opts.o)];
    const shrift = u * 1.2, stroka = shrift * 1.42;
    let h;
    let linii = null;
    if (opts.shtrihi) {
      h = w;
    } else {
      ctx.font = `500 ${shrift}px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif`;
      linii = stroki(ctx, opts.tekst, w - u * 2.6);
      h = linii.length * stroka + u * 2.1;
    }
    if (izmerit) return h;
    ctx.save();
    if (ob.svechenie) { ctx.shadowColor = ob.svechenie; ctx.shadowBlur = u * 1.4; }
    else { ctx.shadowColor = 'rgba(0,0,0,.42)'; ctx.shadowBlur = u * 1.5; ctx.shadowOffsetY = u * 0.5; }
    ctx.fillStyle = ob.fon;
    skruglenie(ctx, x, y, w, h, u);
    ctx.fill();
    ctx.restore();
    ctx.lineWidth = Math.max(1.5, u * 0.08);
    ctx.strokeStyle = ob.ramka;
    skruglenie(ctx, x, y, w, h, u);
    ctx.stroke();
    if (opts.shtrihi) {
      risovat(ctx, opts.shtrihi, opts.c, ob.svet, x + u * 0.5, y + u * 0.5, w - u, 14);
    } else {
      ctx.fillStyle = ob.tekst;
      ctx.textBaseline = 'alphabetic';
      linii.forEach((l, i) => ctx.fillText(l, x + u * 1.3, y + u * 1.05 + shrift * 1.06 + i * stroka));
    }
    return h;
  }

  global.Oform = { OBLOZHKI, CVETA, oblozhka, cveta, svg, risovat, karta, stroki };
})(window);

<script>
/* Связь показа: телефоны зала → экран. Перенесена из доклада «Портрет»

(function (global) {

  // Пульт докладчика: команды телефон → презентация и вид для пульта

  // в этом файле его нет.
  const temaPulta = (klyuch) => BASE + '-u-' + klyuch;
  const temaPultaVid = (klyuch) => BASE + '-v-' + klyuch;
  // Что на экране финала (пожелания и рисунки) — пульту, чтобы удалять.

  // подменный брокер (tools/mqttserver.py), ?mqtt=net — без MQTT.

  const server = (qs.get('ntfy') || 'https://ntfy.sh').replace(/\/$/, '');

  const MQTT = qs.has('mqtt')
    ? qs.get('mqtt').split(',').filter((u) => u && u !== 'net').map((u, i) => ['MQTT ' + (i + 1), u])
    : MQTT_BROKERY;

  function rid(n) {
    const a = new Uint8Array(n || 6);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  function deviceId() {

      let id = localStorage.getItem('dina-ustroystvo');

  // ---- ntfy.sh ----
  // Ответ 429 — дневной лимит сообщений исчерпан. Страницы узнают об этом

  let limit = false;

  async function ntfyPublish(topic, text) {
    if (limit) { const e = new Error('ntfy: дневной лимит сообщений исчерпан'); e.limit = true; throw e; }

      r = await fetch(server + '/' + topic, { method: 'POST', body: text });

  // Телефон «просыпается»: вернулись на страницу, разблокировали экран, снова
  // появилась сеть. Соединения за это время могли тихо умереть (телефон в

  // канал проверяет себя сразу (пользователь 11.10.2026: пожелания с телефона,

  // Датчики для журнала (zhurnal.js): каналы, пинги, пробуждения. Пока журнал
  // не слушает (Svyaz.naSobytie не задан), ничего не делают.
  let naSobytie = null;
  function sobytie(tip, d) { if (naSobytie) { try { naSobytie(tip, d); } catch (e) { /* журнал не мешает связи */ } } }

  // zanovo — страница была свёрнута дольше 2 с (или вернулась из кэша, или
  // снова появилась сеть): соединения не проверять пингом, а сразу открыть
  // новые. iPhone рвёт сокеты свёрнутой вкладки, а страница этого не видит:
  // пинг ждал ответа до 5 с, и пульт после сворачивания оживал секунд через
  // 6 (пользователь 16.10.2026: «долго ждать, чтобы телефон снова
  // подключился»). Теперь — время одного подключения, ~0,3–1 с.
  const ozhiviteli = new Set();
  function ozhivit(zanovo, skryt) {
    sobytie('ozhivit', { zanovo: !!zanovo, skryt: skryt || 0 });
    ozhiviteli.forEach((f) => { try { f(!!zanovo); } catch (e) { /* остальные каналы — дальше */ } });
  }
  if (typeof document !== 'undefined') {
    let skrytS = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') { skrytS = Date.now(); return; }
      const skryt = skrytS > 0 ? Date.now() - skrytS : 0;
      ozhivit(skryt > 2000, skryt);
      skrytS = 0;
    });
    global.addEventListener('pageshow', (e) => { if (e.persisted) ozhivit(true); });
    global.addEventListener('online', () => ozhivit(true));
  }

  // Код ошибки ntfy для журнала: EventSource его не сообщает, поэтому —
  // короткий запрос тех же тем (poll, без ожидания) и его ответ. Не чаще раза
  // в 30 с и только в презентации (Svyaz.kodyOshibok = true; телефоны тоже
  // слушают события, но им проверка ни к чему): запросы к ntfy.sh тоже на
  // счету его лимита.
  let kodNtfyT = 0, kodyOshibok = false;
  function kodNtfy(topics, otkaz) {
    if (!kodyOshibok) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    if (Date.now() - kodNtfyT < 30000) { sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz }); return; }
    kodNtfyT = Date.now();
    fetch(server + '/' + topics[0] + '/json?poll=1&since=' + Math.floor(Date.now() / 1000), { cache: 'no-store' })
      .then((r) => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: r.status }),
        () => sobytie('kanal', { imya: 'ntfy', sost: 'oshibka', otkaz, kod: 'set' }));
  }

  function ntfySubscribe(topics, since, onMsg, onStatus) {
    let es = null, lastId = null, closed = false, delay = 1000, timer = 0, zhivo = 0;
    const seen = new Set();
    const status = (s) => { ntfySost = s; if (onStatus) onStatus(s); };
    function open() {
      if (closed) return;
      const from = lastId || since;
      es = new EventSource(server + '/' + topics.join(',') + '/sse?since=' + encodeURIComponent(from));
      es.onopen = () => { delay = 1000; zhivo = Date.now(); status('open'); sobytie('kanal', { imya: 'ntfy', sost: 'open' }); };
      es.onmessage = (e) => {
        zhivo = Date.now();
        let m;
        try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.event && m.event !== 'message') return;
        if (m.id) {
          if (seen.has(m.id)) return;
          seen.add(m.id);
          lastId = m.id;
        }
        try { onMsg(m.topic, m.message || '', m.time || 0, 'ntfy'); } catch (err) { console.error(err); }
      };

        // (429 — лимит, 5xx); 0 — поток оборвался в сети.

        if (closed) return;
        clearTimeout(timer);
        timer = setTimeout(open, delay);
        delay = Math.min(delay * 2, 15000);

    }
    // Проснулись: закрытое — открыть сейчас; давно молчавшее — открыть заново
    // (с lastId: что пришло за время сна, придёт, повторы отсекает seen).
    const proverka = (zanovo) => {
      if (closed) return;

        if (es) es.close();

    status('connecting');
    open();

  }

  // ---- MQTT 3.1.1 поверх WebSocket ----
  // Свой маленький клиент вместо библиотеки: нужно немного — подключиться,
  // подписаться, отправить с удержанием (retain: новый подписчик сразу получает
  // последнее состояние, как since=latest у ntfy), держать связь и сам

  const stroka = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const paket = (tip, telo) => new Uint8Array([tip, ...dlina(telo.length), ...telo]);

    let ws = null, otkryt = false, pauza = 1000, timer = 0, ping = 0, priem = 0, nomer = 0, podklT = 0, pingT = 0;
    let bufer = new Uint8Array(0);

    const otpravit = (u8) => { try { if (ws && ws.readyState === 1) { ws.send(u8); return true; } } catch (e) { /* ниже — в очередь */ } return false; };

    }

      clearTimeout(timer);

        bufer = new Uint8Array(0);

      };

      tek.onclose = (e) => {
        if (ws !== tek) return;

      };

    function zakrytTekushchee() { try { if (ws) ws.close(); } catch (e) { /* уже закрыто */ } }
    // Соединение умерло — закрыть и подключиться почти сразу, а не через паузу.
    function pereklyuchit() { sobytie('kanal', { imya, sost: 'molchit' }); pauza = 250; zakrytTekushchee(); }
    // Проснулись: нет соединения — подключиться сейчас (пауза могла вырасти до
    // 15 с); есть — пинг, и если за 5 с брокер ничего не прислал, оно мёртвое.
    function proverit(zanovo) {
      if (!temy.size && !zhdutUderzh.size && !zhdutProchie.length) return; // канал ещё не нужен
      if (zanovo && ws) {
        // Старый сокет бросаем, не дожидаясь его закрытия: у «тихо умершего»
        // onclose может прийти не скоро, а его обработчик чужой сокет и так
        // пропускает (ws !== tek).
        sobytie('kanal', { imya, sost: 'zanovo' });
        zakrytTekushchee();
        ws = null; otkryt = false; clearInterval(ping);
      }

      if (!otkryt) return; // подключается

      pingT = Date.now();
      otpravit(new Uint8Array([0xc0, 0]));
      setTimeout(() => { if (ws === tek && priem === pered) pereklyuchit(); }, 5000);
    }
    ozhiviteli.add(proverit);
    function prinyat(kusok) {
      priem = Date.now();
      const b = new Uint8Array(bufer.length + kusok.length);
      b.set(bufer);
      b.set(kusok, bufer.length);
      bufer = b;
      for (;;) {
        if (bufer.length < 2) return;

        bufer = bufer.slice(i + dl);

          otkryt = true;
          pauza = 1000;
          sobytie('kanal', { imya, sost: 'open', ms: Date.now() - podklT });
          temy.forEach((t) => otpravit(podpiska(t)));
          zhdutUderzh.forEach((u8) => otpravit(u8));
          zhdutUderzh.clear();
          zhdutProchie.splice(0).forEach((u8) => otpravit(u8));
          clearInterval(ping);
          // Пинг раз в 10 с; 25 с тишины — два пинга без ответа: соединение
          // умерло (сменилась сеть, телефон спал) — переподключиться сразу.
          // Было 25 и 70 с: телефон по минуте показывал старое (11.10.2026).
          ping = setInterval(() => {
            if (Date.now() - priem > 25000) { pereklyuchit(); return; }
            pingT = Date.now();
            otpravit(new Uint8Array([0xc0, 0]));
          }, 10000);
          smenit('open');
        } else if (tip === 13) { // PINGRESP
          if (pingT) { sobytie('ping', { imya, ms: Date.now() - pingT }); pingT = 0; }
        } else if (tip === 3) { // PUBLISH
          const tl = (telo[0] << 8) | telo[1];
          const tema = dec.decode(telo.subarray(2, 2 + tl));
          let s = 2 + tl;
          if ((flagi >> 1) & 3) s += 2; // QoS > 0: номер пакета
          if (dvoichnyeTemy.has(tema)) { // кадр камеры — как есть, не текст
            const u8 = telo.slice(s);
            dvoichnye.forEach((f) => { try { f(tema, u8); } catch (e) { console.error(e); } });
            continue;
          }
          const tekst = dec.decode(telo.subarray(s));
          slushateli.forEach((f) => { try { f(tema, tekst); } catch (e) { console.error(e); } });
        }
      }
    }
    return {
      k,
      slushat(f) { slushateli.add(f); return () => slushateli.delete(f); },
      sledit(f) { sledyashchie.add(f); f(k.sost); return () => sledyashchie.delete(f); },
      podpisat(tema) {
        if (temy.has(tema)) return;
        temy.add(tema);
        if (otkryt) otpravit(podpiska(tema));
        podklyuchit();
      },
      // Кадры камеры — двоичные и без очереди: не ушёл сейчас — пропущен
      // (живому видео старый кадр не нужен). zanyat — сокет ещё отправляет
      // прошлый: следующий кадр не снимать, иначе очередь растёт. Было 128 КБ —
      // за ними на медленном мобильном интернете копилась секунда-другая
      // «пинга» (пользователь, 08.10.2026); теперь — почти пустой буфер.
      slushatDvoichno(f) { dvoichnye.add(f); return () => dvoichnye.delete(f); },
      podpisatDvoichno(tema) { dvoichnyeTemy.add(tema); this.podpisat(tema); },
      get zanyat() { return !ws || ws.bufferedAmount > 16 * 1024; },
      publikovatDvoichno(tema, u8) {
        podklyuchit();
        if (!otkryt || this.zanyat) return false;
        return otpravit(paketDvoichno(0x30, stroka(tema), u8));
      },
      // true — ушло сразу; иначе ждёт подключения (состояние — только последнее).
      publikovat(tema, tekst, uderzhat) {
        const u8 = paket(0x30 | (uderzhat ? 1 : 0), [...stroka(tema), ...enc.encode(tekst)]);
        podklyuchit();
        if (otkryt && otpravit(u8)) return true;
        if (uderzhat) zhdutUderzh.set(tema, u8);
        else { zhdutProchie.push(u8); if (zhdutProchie.length > 20) zhdutProchie.shift(); }
        return false;
      },
    };
  }
  const mqttKlienty = [];
  function mqttVse() {
    if (!mqttKlienty.length) MQTT.forEach(([imya, url]) => mqttKlienty.push(mqttKlient(imya, url)));
    return mqttKlienty;
  }

  // ---- все каналы вместе ----
  // Отправить во все каналы. Успех — если сообщение ушло хотя бы в один.
  // Состояние доклада — с удержанием: телефон, открывший страницу позже,
  // сразу получает текущую сцену.
  // opts.uderzhat — с удержанием и для другой темы (вид пульта докладчика).
  function publish(topic, text, opts) {
    const uderzhat = topic === T.state || !!(opts && opts.uderzhat);
    let ushlo = false;
    mqttVse().forEach((m) => { if (m.publikovat(topic, text, uderzhat)) ushlo = true; });
    return ntfyPublish(topic, text).then(() => true, (e) => {
      if (ushlo) return true;
      throw e;
    });
  }

  // Подписка сразу на все каналы. onMsg(topic, text, timeSec) зовётся по разу
  // от каждого канала — повторы отсеивает приёмник (по t в сообщении).
  // onStatus('open' — хоть один канал на связи | 'wait' — ни одного, все
  // пробовали). Пока каналы только подключаются, статуса нет.
  function subscribe(topics, since, onMsg, onStatus) {
    const sost = new Map();
    const obnovit = () => {
      const vse = [...sost.values()];
      const s = vse.includes('open') ? 'open' : vse.length && !vse.includes('connecting') ? 'wait' : null;
      if (s && onStatus) onStatus(s);
    };
    const otpiski = [];
    const ntfy = ntfySubscribe(topics, since, onMsg, (s) => { sost.set('ntfy', s); obnovit(); });
    mqttVse().forEach((m) => {
      otpiski.push(m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, Date.now() / 1000, m.k.imya); }));
      otpiski.push(m.sledit((s) => { sost.set(m.k.imya, s); obnovit(); }));
      topics.forEach((t) => m.podpisat(t));
    });
    return { close() { ntfy.close(); otpiski.forEach((f) => f()); } };
  }

  // ---- только через MQTT-брокеры, мимо ntfy и его дневного лимита ----
  // Штрихи часов, пока человек рисует: по сообщению раз в ~0,4 с с каждого
  // телефона зала — ntfy такого не выдержит (250 в сутки на IP).
  function publishMqtt(topic, text, uderzhat) { mqttVse().forEach((m) => m.publikovat(topic, text, !!uderzhat)); }
  function subscribeMqtt(topics, onMsg) {
    const otpiski = mqttVse().map((m) => {
      const f = m.slushat((tema, tekst) => { if (topics.includes(tema)) onMsg(tema, tekst, m.k.imya); });
      topics.forEach((tm) => m.podpisat(tm));
      return f;
    });
    return { close() { otpiski.forEach((f) => f()); } };
  }

  // Каналы и их состояние — для подписей на экране докладчика.
  function kanaly() {
    const ks = mqttKlienty.map((m) => ({ imya: m.k.imya, mqtt: true, sost: m.k.sost }));
    if (ntfySost) ks.push({ imya: 'ntfy', mqtt: false, sost: limit ? 'limit' : ntfySost });
    return ks;
  }
  // Дойдёт ли команда до телефонов: 'da' | 'limit' | 'zhdu' | 'net'. Подписка
  // ntfy жива и при исчерпанном лимите — но отправить в него уже нельзя.
  function dostavka() {
    const ks = kanaly();
    if (ks.some((k) => k.mqtt && k.sost === 'open')) return 'da';
    if (limit) return 'limit';
    if (ks.some((k) => k.sost === 'open')) return 'da';
    if (ks.some((k) => k.sost === 'connecting')) return 'zhdu';
    return 'net';
  }


  global.Svyaz = {
    BASE, T, server, deviceId, publish, subscribe, kanaly, dostavka, temaPulta, temaPultaVid, temaPultaSpisok, ozhivit,
    publishMqtt, subscribeMqtt,
    set naSobytie(f) { naSobytie = f; },
    set kodyOshibok(v) { kodyOshibok = !!v; },
    get limit() { return limit; },
  };
})(window);
</script>
<script>
/* Страница телефона: поздравление Дине → экран показа (тема Svyaz.T.wishes).
   Анонимно. Текст {v: 1, id, u, t, x, o} или рисунок {v: 1, id, u, t, r, c, o}:
   r — штрихи chasy.js, c — цвет каждой линии (цифра палитры Oform.CVETA), o — обложка
   карточки (Oform.OBLOZHKI). Уходит во все каналы сразу; повтор после ошибки — с тем же
   id. С одного телефона — не больше POZH_MAKS отправок.

   Вкладка «Все поздравления»: что сейчас на экране показа (тема <BASE>-l, экран
   держит её с удержанием) — читать с телефона и «Сохранить себе» картинкой. */
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const tekst = $('#tekst'), knopka = $('#otpravit'), itog = $('#itog');
  const POZH_MAKS = 10;
  const RIS_MAKS = 850; // точек: рисунок влезает и в ntfy (до 4 КБ)

  let rezhim = 'tekst';
  let zanyato = false;
  let zhdet = null; // не ушедшее сообщение: повтор — с тем же id
  let otpravleno = 0;
  try { otpravleno = Number(sessionStorage.getItem('dina-otpravleno')) || 0; } catch (e) { /* без памяти */ }

  // ---- вкладки ----
  document.querySelectorAll('[data-vkladka]').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('[data-vkladka]').forEach((c) => {
        c.classList.toggle('on', c === b);
        c.setAttribute('aria-selected', String(c === b));
      });
      $('#forma').hidden = b.dataset.vkladka !== 'forma';
      $('#vse').hidden = b.dataset.vkladka !== 'vse';
      if (b.dataset.vkladka === 'forma' && rezhim === 'ris') razmer();
    };
  });

  // ---- обложка карточки ----
  let oblozhka = 'grafit';
  Object.entries(Oform.OBLOZHKI).forEach(([id, ob]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'o-' + id + (id === oblozhka ? ' on' : '');
    b.textContent = ob.nazv;
    b.onclick = () => {
      oblozhka = id;
      zhdet = null;
      document.querySelectorAll('#oblozhki button').forEach((c) => c.classList.toggle('on', c === b));
      risovat();
    };
    $('#oblozhki').appendChild(b);
  });

  // ---- рисунок: штрихи пальцем, как в «Портрете», с цветом у каждой линии ----
  const holst = $('#holst'), ctx = holst.getContext('2d');
  let shtrihi = [], cveta = '', tek = null, cvet = 0;
  Oform.CVETA.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--c', c);
    b.setAttribute('aria-label', 'Цвет ' + (i + 1));
    if (i === 0) b.classList.add('on');
    b.onclick = () => {
      cvet = i;
      document.querySelectorAll('#palitra button').forEach((x) => x.classList.toggle('on', x === b));
    };
    $('#palitra').appendChild(b);
  });
  const tochek = () => shtrihi.reduce((a, s) => a + s.length, 0);
  function razmer() {
    const w = holst.clientWidth;
    if (!w) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    if (holst.width !== Math.round(w * dpr)) holst.width = holst.height = Math.round(w * dpr);
    risovat();
  }
  function risovat() {
    const s = holst.width;
    if (!s) return;
    const ob = Oform.OBLOZHKI[oblozhka];
    ctx.fillStyle = ob.fon;
    ctx.fillRect(0, 0, s, s);
    Oform.risovat(ctx, shtrihi, cveta, ob.svet, 0, 0, s, 12);
  }
  const tochka = (e) => {
    const r = holst.getBoundingClientRect();
    return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))];
  };
  holst.addEventListener('pointerdown', (e) => {
    if (tochek() >= RIS_MAKS - 2 || shtrihi.length >= 300) return;
    e.preventDefault();
    holst.setPointerCapture(e.pointerId);
    tek = [tochka(e)];
    shtrihi.push(tek);
    cveta += String(cvet);
    zhdet = null;
    risovat();
    obnovit();
  });
  holst.addEventListener('pointermove', (e) => {
    if (!tek) return;
    e.preventDefault();
    const [x, y] = tochka(e), [px, py] = tek[tek.length - 1];
    if (Math.hypot(x - px, y - py) < 0.008 || tochek() >= RIS_MAKS) return;
    tek.push([x, y]);
    risovat();
  });
  const konec = () => { tek = null; obnovit(); };
  holst.addEventListener('pointerup', konec);
  holst.addEventListener('pointercancel', konec);
  $('#b-otmena').onclick = () => { shtrihi.pop(); cveta = cveta.slice(0, -1); zhdet = null; risovat(); obnovit(); };
  $('#b-steret').onclick = () => { shtrihi = []; cveta = ''; zhdet = null; risovat(); obnovit(); };

  document.querySelectorAll('.vybor [data-rezhim]').forEach((b) => {
    b.onclick = () => {
      rezhim = b.dataset.rezhim;
      document.querySelectorAll('.vybor [data-rezhim]').forEach((c) => {
        c.classList.toggle('on', c === b);
        c.setAttribute('aria-selected', String(c === b));
      });
      $('#blok-tekst').hidden = rezhim !== 'tekst';
      $('#blok-ris').hidden = rezhim !== 'ris';
      if (rezhim === 'ris') razmer();
      obnovit();
    };
  });
  window.addEventListener('resize', () => { if (rezhim === 'ris') razmer(); });

  function obnovit() {
    $('#schet').textContent = tekst.value.length + ' / ' + tekst.maxLength;
    const est = rezhim === 'ris' ? shtrihi.length > 0 : tekst.value.trim().length >= 2;
    knopka.disabled = zanyato || otpravleno >= POZH_MAKS || !est;
  }
  tekst.addEventListener('input', () => { zhdet = null; obnovit(); });

  function rid() {
    const a = new Uint8Array(8);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  knopka.addEventListener('click', async () => {
    const ris = rezhim === 'ris';
    const x = tekst.value.replace(/\s+/g, ' ').trim().slice(0, tekst.maxLength);
    const r = ris ? Chasy.kodirovat(shtrihi) : '';
    if ((ris ? !r : x.length < 2) || zanyato || otpravleno >= POZH_MAKS) return;
    if (!zhdet) {
      const telo = ris ? { r, c: cveta } : { x };
      zhdet = JSON.stringify(Object.assign({ v: 1, id: rid(), u: Svyaz.deviceId(), t: Date.now() / 1000, o: oblozhka }, telo));
    }
    zanyato = true;
    itog.textContent = 'Отправляю…';
    obnovit();
    try {
      await Svyaz.publish(Svyaz.T.wishes, zhdet);
      zhdet = null;
      otpravleno++;
      try { sessionStorage.setItem('dina-otpravleno', String(otpravleno)); } catch (e) { /* без памяти */ }
      if (ris) { shtrihi = []; cveta = ''; risovat(); } else tekst.value = '';
      itog.textContent = otpravleno >= POZH_MAKS
        ? 'Спасибо! С одного телефона — не больше ' + POZH_MAKS + ' поздравлений.'
        : ris ? 'Рисунок отправлен — смотрите на экран. Можно ещё.'
          : 'Отправлено — смотрите на экран. Можно написать ещё.';
    } catch (e) {
      itog.textContent = 'Не отправилось — нет связи. Попробуйте ещё раз.';
    }
    setTimeout(() => { zanyato = false; obnovit(); }, 1200);
  });
  obnovit();

  // ---- все поздравления: список с экрана показа ----
  let spisok = [];
  function razobrat(tekstSoob) {
    let m;
    try { m = JSON.parse(tekstSoob); } catch (e) { return null; }
    if (!m || m.v !== 1 || !Array.isArray(m.el)) return null;
    return m.el.slice(0, 60).map((w) => {
      if (!w || typeof w.id !== 'string') return null;
      const o = Oform.oblozhka(w.o);
      if (typeof w.r === 'string') {
        const sh = Chasy.raskodirovat(w.r);
        return sh && sh.length ? { id: w.id, sh, c: Oform.cveta(w.c, sh.length), o } : null;
      }
      return typeof w.x === 'string' && w.x.trim() ? { id: w.id, x: w.x.slice(0, 300), o } : null;
    }).filter(Boolean);
  }
  function pokazatSpisok() {
    const box = $('#spisok');
    box.textContent = '';
    spisok.slice().reverse().forEach((w) => { // новые — сверху
      const el = document.createElement('div');
      el.className = 'pk o-' + w.o + (w.sh ? ' ris' : '');
      if (w.sh) el.appendChild(Oform.svg(w.sh, w.c, Oform.OBLOZHKI[w.o].svet, 'risunok'));
      else el.textContent = w.x;
      box.appendChild(el);
    });
    $('#kolvo').textContent = spisok.length ? '(' + spisok.length + ')' : '';
    $('#spisok-pusto').hidden = spisok.length > 0;
    $('#sohranit').disabled = !spisok.length;
  }
  // Каналы открываются сразу — и первое поздравление уйдёт без ожидания подключения.
  Svyaz.subscribeMqtt([Svyaz.BASE + '-l'], (tema, tekstSoob) => {
    const s = razobrat(tekstSoob);
    if (s) { spisok = s; pokazatSpisok(); }
  });
  pokazatSpisok();

  // «Сохранить себе»: картинка со всеми поздравлениями — в галерею (поделиться) или файлом.
  $('#sohranit').addEventListener('click', async () => {
    const W = 1080, u = 30, pad = 60, g = 26;
    const holstS = document.createElement('canvas');
    const c2 = holstS.getContext('2d');
    const shir = W - 2 * pad;
    const elementy = spisok.slice().reverse();
    const vys = elementy.map((w) => (w.sh ? shir * 0.6 : Oform.karta(c2, shir, u, 0, 0, { tekst: w.x, o: w.o }, true)));
    holstS.width = W;
    holstS.height = pad * 2 + 120 + vys.reduce((a, h) => a + h + g, 0);
    c2.fillStyle = '#0b0b0c';
    c2.fillRect(0, 0, holstS.width, holstS.height);
    c2.fillStyle = '#f3f3f4';
    c2.font = '700 56px "Segoe UI", system-ui, -apple-system, sans-serif';
    c2.fillText('Поздравления Дине', pad, pad + 56);
    let y = pad + 120;
    elementy.forEach((w, i) => {
      if (w.sh) Oform.karta(c2, shir * 0.6, u, pad, y, { shtrihi: w.sh, c: w.c, o: w.o });
      else Oform.karta(c2, shir, u, pad, y, { tekst: w.x, o: w.o });
      y += vys[i] + g;
    });
    const blob = await new Promise((ok) => holstS.toBlob(ok, 'image/png'));
    if (!blob) return;
    const fajl = new File([blob], 'Поздравления Дине.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [fajl] })) {
        await navigator.share({ files: [fajl], title: 'Поздравления Дине' });
        $('#itog-sohr').textContent = 'Готово.';
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fajl.name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    $('#itog-sohr').textContent = 'Картинка сохранена в загрузки.';
  });
})();
</script>
